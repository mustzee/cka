<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CKA 시험 시뮬레이터</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            padding: 40px;
        }

        .card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid #e9ecef;
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.8em;
        }

        .type-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .type-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .type-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .type-card.selected {
            border-color: #667eea;
            background: #f0f3ff;
        }

        .type-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .type-card .description {
            color: #6c757d;
            font-size: 0.9em;
            margin: 10px 0;
        }

        .type-card .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 0.85em;
            color: #495057;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px 5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .question-list {
            margin: 20px 0;
        }

        .question-item {
            background: white;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }

        .question-item h4 {
            color: #495057;
            margin-bottom: 5px;
        }

        .question-item .meta {
            font-size: 0.85em;
            color: #6c757d;
        }

        .timer {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            font-size: 1.2em;
            font-weight: bold;
            color: #667eea;
        }

        .timer.warning {
            color: #dc3545;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .result-card {
            background: white;
            border-left: 4px solid #28a745;
            padding: 20px;
            margin: 10px 0;
            border-radius: 5px;
        }

        .result-card.failed {
            border-left-color: #dc3545;
        }

        .progress-bar {
            background: #e9ecef;
            height: 30px;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            transition: width 0.5s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .stat-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #e9ecef;
        }

        .stat-box .number {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-box .label {
            color: #6c757d;
            margin-top: 10px;
        }

        .hidden {
            display: none !important;
        }

        #loadingSpinner {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 CKA 시험 시뮬레이터</h1>
            <p class="subtitle">Kubernetes Certified Administrator 실전 연습</p>
        </header>

        <div class="content">
            <!-- 시작 화면 -->
            <div id="startScreen">
                <div class="card">
                    <h2>시험 타입 선택</h2>
                    <div class="type-selector" id="typeSelector">
                        <!-- JavaScript로 동적 생성 -->
                    </div>
                </div>

                <div class="card">
                    <h2>옵션</h2>
                    <label>
                        <input type="checkbox" id="practiceModeCheckbox">
                        연습 모드 (타이머 없음)
                    </label>
                </div>

                <div style="text-align: center; margin-top: 30px;">
                    <button onclick="startExam()" id="startButton">시험 시작</button>
                    <button onclick="viewStatistics()">통계 보기</button>
                </div>
            </div>

            <!-- 시험 진행 화면 -->
            <div id="examScreen" class="hidden">
                <div class="card">
                    <h2>시험 진행 중...</h2>
                    <p>별도 터미널에서 kubectl 명령어를 사용하여 문제를 해결하세요.</p>
                    <div id="questionList"></div>
                    <div style="text-align: center; margin-top: 30px;">
                        <button onclick="finishExam()">시험 종료 및 채점</button>
                    </div>
                </div>
            </div>

            <!-- 결과 화면 -->
            <div id="resultScreen" class="hidden">
                <div class="card">
                    <h2>시험 결과</h2>
                    <div id="scoreDisplay"></div>
                    <div id="resultsList"></div>
                    <div style="text-align: center; margin-top: 30px;">
                        <button onclick="resetExam()">새 시험 시작</button>
                        <button onclick="viewStatistics()">통계 보기</button>
                    </div>
                </div>
            </div>

            <!-- 통계 화면 -->
            <div id="statsScreen" class="hidden">
                <div class="card">
                    <h2>📊 통계</h2>
                    <div id="statsDisplay"></div>
                    <div style="text-align: center; margin-top: 30px;">
                        <button onclick="resetExam()">돌아가기</button>
                    </div>
                </div>
            </div>

            <!-- 로딩 스피너 -->
            <div id="loadingSpinner" class="hidden">
                <div class="spinner"></div>
                <p style="text-align: center; margin-top: 20px;">처리 중...</p>
            </div>
        </div>
    </div>

    <!-- 타이머 (시험 중) -->
    <div id="timerDisplay" class="timer hidden">
        <span id="timerText">02:00:00</span>
    </div>

    <script src="app.js"></script>
</body>
</html>

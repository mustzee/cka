id: A014
title: ResourceQuota 및 LimitRange 설정
domain: Cluster Architecture
difficulty: medium
weight: 6
time_estimate: 10
description: 'Context: kubectl config use-context cluster1


  개발팀을 위한 네임스페이스에 리소스 제한을 설정해야 합니다.

  '
task: "다음 작업을 수행하세요:\n\n1. 네임스페이스 생성:\n   - 이름: dev-team\n\n2. ResourceQuota 생성:\n\
  \   - 이름: dev-quota\n   - 최대 Pod: 10개\n   - 최대 CPU 요청: 4 cores\n   - 최대 메모리 요청:\
  \ 8Gi\n\n3. LimitRange 생성:\n   - 이름: dev-limits\n   - 컨테이너 기본 CPU 요청: 100m\n   -\
  \ 컨테이너 기본 메모리 요청: 128Mi\n   - 컨테이너 최대 CPU: 500m\n   - 컨테이너 최대 메모리: 512Mi\n"
hints:
- ResourceQuota는 네임스페이스 전체 제한
- LimitRange는 개별 리소스 기본값/제한
validation:
  checks:
  - resource: namespace
    name: dev-team
  - resource: resourcequota
    name: dev-quota
    namespace: dev-team
  - resource: limitrange
    name: dev-limits
    namespace: dev-team
solution: "해결 방법:\n\n```bash\n# 1. 네임스페이스 생성\nkubectl create namespace dev-team\n\n\
  # 2. ResourceQuota 생성\ncat <<EOF | kubectl apply -f -\napiVersion: v1\nkind: ResourceQuota\n\
  metadata:\n  name: dev-quota\n  namespace: dev-team\nspec:\n  hard:\n    pods: \"\
  10\"\n    requests.cpu: \"4\"\n    requests.memory: 8Gi\nEOF\n\n# 3. LimitRange\
  \ 생성\ncat <<EOF | kubectl apply -f -\napiVersion: v1\nkind: LimitRange\nmetadata:\n\
  \  name: dev-limits\n  namespace: dev-team\nspec:\n  limits:\n  - default:\n   \
  \   cpu: 500m\n      memory: 512Mi\n    defaultRequest:\n      cpu: 100m\n     \
  \ memory: 128Mi\n    max:\n      cpu: 500m\n      memory: 512Mi\n    type: Container\n\
  EOF\n\n# 확인\nkubectl get resourcequota -n dev-team\nkubectl describe resourcequota\
  \ dev-quota -n dev-team\nkubectl get limitrange -n dev-team\nkubectl describe limitrange\
  \ dev-limits -n dev-team\n\n# 테스트: 리소스 명시 없이 Pod 생성\nkubectl run test-pod --image=nginx\
  \ -n dev-team\nkubectl get pod test-pod -n dev-team -o yaml | grep -A 10 resources\n\
  # 기본값이 자동으로 적용됨\n```\n"
explanation: "ResourceQuota와 LimitRange를 통한 리소스 관리를 평가합니다.\n\nResourceQuota:\n- 네임스페이스별\
  \ 총 리소스 제한\n- 멀티테넌시 환경에 필수\n\n제한 가능 항목:\n1. 컴퓨팅 리소스:\n   - requests.cpu, limits.cpu\n\
  \   - requests.memory, limits.memory\n   - requests.storage\n\n2. 오브젝트 수:\n   -\
  \ pods, services\n   - configmaps, secrets\n   - persistentvolumeclaims\n\n3. 확장\
  \ 리소스:\n   - requests.nvidia.com/gpu\n\nLimitRange:\n- 개별 리소스의 기본값 및 제한\n- Pod/Container별\
  \ 적용\n\n설정 항목:\n1. default: 제한값 (limits)\n2. defaultRequest: 요청값 (requests)\n3.\
  \ max: 최대값\n4. min: 최소값\n5. maxLimitRequestRatio: limit/request 비율\n\n타입:\n- Container:\
  \ 컨테이너별\n- Pod: Pod별\n- PersistentVolumeClaim: PVC별\n\n동작 방식:\n1. ResourceQuota\
  \ 없으면:\n   - 무제한 리소스 사용 가능\n\n2. ResourceQuota 있고 LimitRange 없으면:\n   - Pod는 반드시\
  \ requests/limits 명시 필요\n\n3. 둘 다 있으면:\n   - LimitRange가 기본값 제공\n   - Pod 생성 시 자동\
  \ 적용\n\n실무 적용:\n- 팀/프로젝트별 네임스페이스 분리\n- 각 네임스페이스에 quota 설정\n- 공정한 리소스 분배\n- 비용 관리\n\
  \n예제 시나리오:\n```yaml\n# 개발 환경: 작은 할당\nrequests.cpu: \"2\"\nrequests.memory: 4Gi\n\
  \n# 스테이징: 중간 할당\nrequests.cpu: \"4\"\nrequests.memory: 8Gi\n\n# 프로덕션: 큰 할당\nrequests.cpu:\
  \ \"16\"\nrequests.memory: 32Gi\n```\n"
references:
- https://kubernetes.io/docs/concepts/policy/resource-quotas/
- https://kubernetes.io/docs/concepts/policy/limit-range/
context: cluster2

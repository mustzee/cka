id: "A012"
title: "CronJob을 사용한 주기적 작업"
domain: "Workloads & Scheduling"
difficulty: "medium"
weight: 5
time_estimate: 7

description: |
  Context: kubectl config use-context cluster1

  데이터베이스 백업을 매일 자정에 자동으로 수행해야 합니다.

task: |
  다음 요구사항을 만족하는 CronJob을 생성하세요:

  - 이름: database-backup
  - 네임스페이스: default
  - 스케줄: 매일 자정 (0 0 * * *)
  - 이미지: busybox:latest
  - 명령어: ["sh", "-c", "echo Backup completed at $(date)"]
  - 성공한 작업 히스토리: 3개
  - 실패한 작업 히스토리: 1개
  - 동시 실행 방지 (concurrencyPolicy: Forbid)

hints:
  - "Cron 표현식: 분 시 일 월 요일"
  - "successfulJobsHistoryLimit 사용"

validation:
  checks:
    - resource: "cronjob"
      name: "database-backup"
      namespace: "default"

solution: |
  해결 방법:

  ```bash
  # CronJob 생성
  cat <<EOF | kubectl apply -f -
  apiVersion: batch/v1
  kind: CronJob
  metadata:
    name: database-backup
    namespace: default
  spec:
    schedule: "0 0 * * *"
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 1
    concurrencyPolicy: Forbid
    jobTemplate:
      spec:
        template:
          spec:
            containers:
            - name: backup
              image: busybox:latest
              command:
              - sh
              - -c
              - echo Backup completed at $(date)
            restartPolicy: OnFailure
  EOF

  # 확인
  kubectl get cronjob database-backup
  kubectl describe cronjob database-backup

  # 수동 실행 (테스트용)
  kubectl create job manual-backup --from=cronjob/database-backup

  # 실행 히스토리 확인
  kubectl get jobs -l parent=database-backup
  ```

explanation: |
  CronJob을 사용한 스케줄링된 작업 실행을 평가합니다.

  CronJob이란:
  - Cron 형식으로 주기적 작업 실행
  - Job을 생성하여 Pod 실행
  - 백업, 리포트 생성, 정리 작업 등에 사용

  Cron 표현식:
  ```
  ┌───────────── 분 (0 - 59)
  │ ┌───────────── 시 (0 - 23)
  │ │ ┌───────────── 일 (1 - 31)
  │ │ │ ┌───────────── 월 (1 - 12)
  │ │ │ │ ┌───────────── 요일 (0 - 6) (일요일=0)
  │ │ │ │ │
  * * * * *
  ```

  예제:
  - "0 0 * * *": 매일 자정
  - "*/15 * * * *": 15분마다
  - "0 2 * * 0": 매주 일요일 오전 2시
  - "0 0 1 * *": 매월 1일 자정
  - "0 9-17 * * 1-5": 월-금 9시-17시 매시간

  concurrencyPolicy:
  1. Allow (기본): 동시 실행 허용
  2. Forbid: 이전 작업 실행 중이면 건너뜀
  3. Replace: 이전 작업 취소하고 새로 시작

  startingDeadlineSeconds:
  - 예약 시간을 놓쳤을 때 허용 시간
  - 초과 시 건너뜀

  suspend:
  - true: 일시 중지
  - 기존 Job은 영향 없음

  실무 고려사항:
  - 멱등성 보장 (재실행 시 안전)
  - 타임존 고려 (UTC 기준)
  - 실패 시 알림 설정
  - 리소스 제한 설정

  Job vs CronJob:
  - Job: 일회성 작업
  - CronJob: 주기적 작업

references:
  - "https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/"

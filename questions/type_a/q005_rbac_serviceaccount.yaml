id: "A005"
title: "ServiceAccount 및 RBAC 구성"
domain: "Cluster Architecture"
difficulty: "medium"
weight: 7
time_estimate: 12

description: |
  Context: kubectl config use-context cluster1

  애플리케이션을 위한 ServiceAccount와 적절한 권한을 구성해야 합니다.

task: |
  다음 요구사항을 만족하도록 구성하세요:

  1. ServiceAccount 생성:
     - 이름: app-sa
     - 네임스페이스: production

  2. Role 생성:
     - 이름: pod-reader
     - 네임스페이스: production
     - 권한: pods 리소스에 대한 get, list, watch

  3. RoleBinding 생성:
     - 이름: app-sa-binding
     - 네임스페이스: production
     - ServiceAccount app-sa를 Role pod-reader에 바인딩

hints:
  - "kubectl create serviceaccount 명령어 사용"
  - "kubectl create role 명령어 사용"
  - "kubectl create rolebinding 명령어 사용"

validation:
  checks:
    - resource: "serviceaccount"
      name: "app-sa"
      namespace: "production"

    - resource: "role"
      name: "pod-reader"
      namespace: "production"

    - resource: "rolebinding"
      name: "app-sa-binding"
      namespace: "production"

solution: |
  해결 방법:

  ```bash
  # 1. ServiceAccount 생성
  kubectl create serviceaccount app-sa -n production

  # 2. Role 생성
  kubectl create role pod-reader \
    --verb=get,list,watch \
    --resource=pods \
    -n production

  # 3. RoleBinding 생성
  kubectl create rolebinding app-sa-binding \
    --role=pod-reader \
    --serviceaccount=production:app-sa \
    -n production

  # 또는 YAML 사용
  cat <<EOF | kubectl apply -f -
  apiVersion: v1
  kind: ServiceAccount
  metadata:
    name: app-sa
    namespace: production
  ---
  apiVersion: rbac.authorization.k8s.io/v1
  kind: Role
  metadata:
    name: pod-reader
    namespace: production
  rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  ---
  apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata:
    name: app-sa-binding
    namespace: production
  subjects:
  - kind: ServiceAccount
    name: app-sa
    namespace: production
  roleRef:
    kind: Role
    name: pod-reader
    apiGroup: rbac.authorization.k8s.io
  EOF

  # 4. 확인
  kubectl get sa app-sa -n production
  kubectl get role pod-reader -n production
  kubectl get rolebinding app-sa-binding -n production

  # 5. 권한 테스트
  kubectl auth can-i list pods \
    --as=system:serviceaccount:production:app-sa \
    -n production
  ```

explanation: |
  이 문제는 RBAC (Role-Based Access Control) 구성 능력을 평가합니다.

  핵심 개념:
  - ServiceAccount: Pod가 API 서버와 통신할 때 사용하는 계정
  - Role: 네임스페이스 내의 권한 정의
  - ClusterRole: 클러스터 전체의 권한 정의
  - RoleBinding: Role을 사용자/그룹/SA에 바인딩
  - ClusterRoleBinding: ClusterRole을 바인딩

  RBAC 구조:
  1. 주체 (Subject): User, Group, ServiceAccount
  2. 역할 (Role/ClusterRole): 수행 가능한 작업 정의
  3. 바인딩 (Binding): 주체와 역할을 연결

  실무 적용:
  - 최소 권한 원칙 적용
  - 각 애플리케이션마다 별도의 ServiceAccount 사용
  - 정기적인 권한 감사

references:
  - "https://kubernetes.io/docs/reference/access-authn-authz/rbac/"

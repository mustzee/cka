id: A005
title: ServiceAccount 및 RBAC 구성
domain: Cluster Architecture
difficulty: medium
weight: 7
time_estimate: 12
description: 'Context: kubectl config use-context cluster1


  애플리케이션을 위한 ServiceAccount와 적절한 권한을 구성해야 합니다.

  '
task: "다음 요구사항을 만족하도록 구성하세요:\n\n1. ServiceAccount 생성:\n   - 이름: app-sa\n   - 네임스페이스:\
  \ production\n\n2. Role 생성:\n   - 이름: pod-reader\n   - 네임스페이스: production\n   -\
  \ 권한: pods 리소스에 대한 get, list, watch\n\n3. RoleBinding 생성:\n   - 이름: app-sa-binding\n\
  \   - 네임스페이스: production\n   - ServiceAccount app-sa를 Role pod-reader에 바인딩\n"
hints:
- kubectl create serviceaccount 명령어 사용
- kubectl create role 명령어 사용
- kubectl create rolebinding 명령어 사용
validation:
  checks:
  - resource: serviceaccount
    name: app-sa
    namespace: production
  - resource: role
    name: pod-reader
    namespace: production
  - resource: rolebinding
    name: app-sa-binding
    namespace: production
solution: "해결 방법:\n\n```bash\n# 1. ServiceAccount 생성\nkubectl create serviceaccount\
  \ app-sa -n production\n\n# 2. Role 생성\nkubectl create role pod-reader \\\n  --verb=get,list,watch\
  \ \\\n  --resource=pods \\\n  -n production\n\n# 3. RoleBinding 생성\nkubectl create\
  \ rolebinding app-sa-binding \\\n  --role=pod-reader \\\n  --serviceaccount=production:app-sa\
  \ \\\n  -n production\n\n# 또는 YAML 사용\ncat <<EOF | kubectl apply -f -\napiVersion:\
  \ v1\nkind: ServiceAccount\nmetadata:\n  name: app-sa\n  namespace: production\n\
  ---\napiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata:\n  name: pod-reader\n\
  \  namespace: production\nrules:\n- apiGroups: [\"\"]\n  resources: [\"pods\"]\n\
  \  verbs: [\"get\", \"list\", \"watch\"]\n---\napiVersion: rbac.authorization.k8s.io/v1\n\
  kind: RoleBinding\nmetadata:\n  name: app-sa-binding\n  namespace: production\n\
  subjects:\n- kind: ServiceAccount\n  name: app-sa\n  namespace: production\nroleRef:\n\
  \  kind: Role\n  name: pod-reader\n  apiGroup: rbac.authorization.k8s.io\nEOF\n\n\
  # 4. 확인\nkubectl get sa app-sa -n production\nkubectl get role pod-reader -n production\n\
  kubectl get rolebinding app-sa-binding -n production\n\n# 5. 권한 테스트\nkubectl auth\
  \ can-i list pods \\\n  --as=system:serviceaccount:production:app-sa \\\n  -n production\n\
  ```\n"
explanation: '이 문제는 RBAC (Role-Based Access Control) 구성 능력을 평가합니다.


  핵심 개념:

  - ServiceAccount: Pod가 API 서버와 통신할 때 사용하는 계정

  - Role: 네임스페이스 내의 권한 정의

  - ClusterRole: 클러스터 전체의 권한 정의

  - RoleBinding: Role을 사용자/그룹/SA에 바인딩

  - ClusterRoleBinding: ClusterRole을 바인딩


  RBAC 구조:

  1. 주체 (Subject): User, Group, ServiceAccount

  2. 역할 (Role/ClusterRole): 수행 가능한 작업 정의

  3. 바인딩 (Binding): 주체와 역할을 연결


  실무 적용:

  - 최소 권한 원칙 적용

  - 각 애플리케이션마다 별도의 ServiceAccount 사용

  - 정기적인 권한 감사

  '
references:
- https://kubernetes.io/docs/reference/access-authn-authz/rbac/
context: cluster5

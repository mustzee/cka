id: A006
title: Node Affinity를 사용한 Pod 스케줄링
domain: Workloads & Scheduling
difficulty: medium
weight: 5
time_estimate: 8
description: 'Context: kubectl config use-context cluster1


  특정 노드에 Pod를 스케줄링하는 작업을 수행해야 합니다.

  '
task: "다음 요구사항을 만족하는 Pod를 생성하세요:\n\n- 이름: scheduled-pod\n- 네임스페이스: default\n- 이미지:\
  \ nginx:latest\n- Node Affinity 규칙:\n  * disk=ssd 레이블이 있는 노드에만 스케줄링\n  * 선호도: requiredDuringSchedulingIgnoredDuringExecution\n"
hints:
- kubectl label node 명령어로 노드에 레이블 추가 가능
- affinity.nodeAffinity 필드 사용
- matchExpressions로 조건 지정
validation:
  checks:
  - resource: pod
    name: scheduled-pod
    namespace: default
    conditions:
    - type: Ready
      status: 'True'
solution: "해결 방법:\n\n```bash\n# 노드에 레이블 추가 (아직 없는 경우)\nkubectl label node <node-name>\
  \ disk=ssd\n\n# Pod 생성\ncat <<EOF | kubectl apply -f -\napiVersion: v1\nkind: Pod\n\
  metadata:\n  name: scheduled-pod\n  namespace: default\nspec:\n  affinity:\n   \
  \ nodeAffinity:\n      requiredDuringSchedulingIgnoredDuringExecution:\n       \
  \ nodeSelectorTerms:\n        - matchExpressions:\n          - key: disk\n     \
  \       operator: In\n            values:\n            - ssd\n  containers:\n  -\
  \ name: nginx\n    image: nginx:latest\nEOF\n\n# 확인\nkubectl get pod scheduled-pod\
  \ -o wide\n```\n"
explanation: "이 문제는 Node Affinity를 통한 고급 스케줄링을 평가합니다.\n\nNode Affinity vs NodeSelector:\n\
  - NodeSelector: 간단한 키-밸류 매칭\n- Node Affinity: 더 표현력 있는 규칙\n\nAffinity 타입:\n1. requiredDuringSchedulingIgnoredDuringExecution\n\
  \   - 하드 제약: 조건을 만족하는 노드에만 스케줄링\n   - 실행 중에는 무시 (노드 레이블 변경되어도 Pod 유지)\n\n2. preferredDuringSchedulingIgnoredDuringExecution\n\
  \   - 소프트 제약: 가능하면 조건 만족하는 노드에 스케줄링\n   - 조건 불만족 시 다른 노드에도 스케줄링 가능\n\nOperators:\n\
  - In: 값이 리스트에 포함\n- NotIn: 값이 리스트에 미포함\n- Exists: 키 존재 (값 무관)\n- DoesNotExist: 키\
  \ 미존재\n- Gt: 값이 더 큼\n- Lt: 값이 더 작음\n"
references:
- https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
context: cluster6

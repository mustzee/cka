id: A027
title: 클러스터 DNS 문제 해결
domain: Troubleshooting
difficulty: medium
weight: 7
time_estimate: 12
description: 'Context: kubectl config use-context cluster1


  클러스터 내 Pod들이 서로 DNS 이름으로 통신할 수 없습니다.

  Service 이름 확인이 실패하고 있으며, CoreDNS에 문제가 있는 것으로 보입니다.

  '
task: "다음 작업을 수행하세요:\n\n1. 클러스터 DNS 문제를 진단하세요\n\n2. DNS가 정상 작동하도록 문제를 해결하세요\n\n3.\
  \ DNS 정상 작동을 검증하세요:\n   - kubernetes.default.svc.cluster.local 조회 성공\n   - 외부 도메인\
  \ (google.com) 조회 성공\n\n4. 진단 과정과 해결 방법을 /tmp/dns-fix.txt에 저장하세요\n"
hints:
- CoreDNS Pod 상태 확인
- kube-dns Service 확인
- CoreDNS ConfigMap 확인
- Pod의 /etc/resolv.conf 확인
validation:
  checks:
  - custom_check: "# CoreDNS Pod가 Running 상태인지 확인\nCOREDNS_RUNNING=$(kubectl get pods\
      \ -n kube-system -l k8s-app=kube-dns -o jsonpath='{.items[*].status.phase}'\
      \ | grep -c Running || echo 0)\nif [ \"$COREDNS_RUNNING\" -ge 1 ]; then\n  echo\
      \ \"PASS\"\nelse\n  echo \"FAIL: CoreDNS pods are not running\"\nfi\n"
  - custom_check: "# kube-dns Service가 존재하는지 확인\nkubectl get svc kube-dns -n kube-system\
      \ &>/dev/null\nif [ $? -eq 0 ]; then\n  echo \"PASS\"\nelse\n  echo \"FAIL:\
      \ kube-dns service not found\"\nfi\n"
  - file: /tmp/dns-fix.txt
    exists: true
solution: "클러스터 DNS 문제 해결:\n\n```bash\n# 1. DNS 문제 확인\n# 테스트 Pod 생성\nkubectl run dns-test\
  \ --image=busybox:latest --restart=Never -- sleep 3600\n\n# DNS 조회 테스트\nkubectl\
  \ exec dns-test -- nslookup kubernetes.default\n# 실패: server can't find kubernetes.default:\
  \ NXDOMAIN\n\nkubectl exec dns-test -- nslookup google.com\n# 실패하거나 느림\n\n# 2. CoreDNS\
  \ Pod 상태 확인\nkubectl get pods -n kube-system -l k8s-app=kube-dns\n# NAME       \
  \                READY   STATUS    RESTARTS   AGE\n# coredns-5d78c9869d-abcde  \
  \ 0/1     CrashLoopBackOff   5          10m\n\nkubectl describe pod -n kube-system\
  \ -l k8s-app=kube-dns\n# Events: Back-off restarting failed container\n\nkubectl\
  \ logs -n kube-system -l k8s-app=kube-dns\n# 오류 메시지 확인\n\n# 3. 일반적인 DNS 문제들:\n\n\
  # 문제 1: CoreDNS Pod가 CrashLoopBackOff\n# 원인: ConfigMap 오류, 플러그인 설정 문제\n\n# CoreDNS\
  \ ConfigMap 확인\nkubectl get configmap coredns -n kube-system -o yaml\n\n# 잘못된 설정\
  \ 예시:\n# - forward 루프\n# - 잘못된 upstream DNS\n# - 플러그인 충돌\n\n# 해결: ConfigMap 수정\n\
  kubectl edit configmap coredns -n kube-system\n\n# 정상 설정 예시:\n# .:53 {\n#     errors\n\
  #     health {\n#        lameduck 5s\n#     }\n#     ready\n#     kubernetes cluster.local\
  \ in-addr.arpa ip6.arpa {\n#        pods insecure\n#        fallthrough in-addr.arpa\
  \ ip6.arpa\n#        ttl 30\n#     }\n#     prometheus :9153\n#     forward . /etc/resolv.conf\
  \ {\n#        max_concurrent 1000\n#     }\n#     cache 30\n#     loop\n#     reload\n\
  #     loadbalance\n# }\n\n# CoreDNS Pod 재시작\nkubectl rollout restart deployment\
  \ coredns -n kube-system\n\n# 문제 2: kube-dns Service 없음\nkubectl get svc kube-dns\
  \ -n kube-system\n# Error: service \"kube-dns\" not found\n\n# 해결: Service 생성\n\
  cat <<EOF | kubectl apply -f -\napiVersion: v1\nkind: Service\nmetadata:\n  name:\
  \ kube-dns\n  namespace: kube-system\n  labels:\n    k8s-app: kube-dns\n    kubernetes.io/name:\
  \ \"CoreDNS\"\nspec:\n  selector:\n    k8s-app: kube-dns\n  clusterIP: 10.96.0.10\
  \  # 클러스터 DNS IP (확인 필요)\n  ports:\n  - name: dns\n    port: 53\n    protocol: UDP\n\
  \    targetPort: 53\n  - name: dns-tcp\n    port: 53\n    protocol: TCP\n    targetPort:\
  \ 53\nEOF\n\n# 문제 3: Service ClusterIP가 잘못됨\n# kubelet 설정 확인\nkubectl get pods -n\
  \ kube-system -l k8s-app=kube-dns -o wide\n\n# kubelet의 --cluster-dns 플래그 확인\nps\
  \ aux | grep kubelet | grep cluster-dns\n# 또는\nsystemctl cat kubelet | grep cluster-dns\n\
  \n# Service ClusterIP와 kubelet 설정 일치 확인\nkubectl get svc kube-dns -n kube-system\
  \ -o jsonpath='{.spec.clusterIP}'\n# 10.96.0.10이어야 함 (기본값, 클러스터마다 다를 수 있음)\n\n#\
  \ 문제 4: CoreDNS 리소스 부족\nkubectl describe pod -n kube-system -l k8s-app=kube-dns\n\
  # OOMKilled, Evicted 확인\n\n# 해결: 리소스 제한 증가\nkubectl edit deployment coredns -n kube-system\n\
  # resources.limits.memory: 170Mi → 256Mi\n\n# 문제 5: NetworkPolicy 차단\nkubectl get\
  \ networkpolicies --all-namespaces\n# CoreDNS 트래픽을 차단하는 정책 확인\n\n# 해결: NetworkPolicy\
  \ 수정 또는 삭제\n\n# 문제 6: Pod의 DNS 설정 오류\nkubectl exec dns-test -- cat /etc/resolv.conf\n\
  # nameserver 10.96.0.10\n# search default.svc.cluster.local svc.cluster.local cluster.local\n\
  # options ndots:5\n\n# dnsPolicy 확인\nkubectl get pod dns-test -o jsonpath='{.spec.dnsPolicy}'\n\
  # ClusterFirst (기본값)\n\n# 4. DNS 검증\n\n# CoreDNS Pod 상태 확인\nkubectl get pods -n\
  \ kube-system -l k8s-app=kube-dns\n# Ready 1/1, Running\n\n# Service DNS 조회\nkubectl\
  \ exec dns-test -- nslookup kubernetes.default\n# 성공: kubernetes.default.svc.cluster.local\
  \ has address 10.96.0.1\n\nkubectl exec dns-test -- nslookup kubernetes.default.svc.cluster.local\n\
  # 성공\n\n# 다른 네임스페이스 Service\nkubectl exec dns-test -- nslookup kube-dns.kube-system\n\
  # 성공\n\n# 외부 도메인\nkubectl exec dns-test -- nslookup google.com\n# 성공\n\n# 5. 결과\
  \ 저장\ncat > /tmp/dns-fix.txt << 'EOF'\nCluster DNS Troubleshooting Report\n==================================\n\
  \nProblem Found:\n- DNS lookups failing for both cluster services and external domains\n\
  - CoreDNS pods in CrashLoopBackOff state\n- Error in logs: \"plugin/loop: Loop detected\
  \ for zone .\"\n\nRoot Cause:\n- CoreDNS ConfigMap had incorrect forward configuration\n\
  - forward . 127.0.0.1 was creating a loop\n- CoreDNS was forwarding DNS queries\
  \ to itself\n\nSolution Applied:\n1. Fixed CoreDNS ConfigMap:\n   - Changed: forward\
  \ . 127.0.0.1\n   - To: forward . /etc/resolv.conf\n\n   Command: kubectl edit configmap\
  \ coredns -n kube-system\n\n2. Restarted CoreDNS deployment:\n   Command: kubectl\
  \ rollout restart deployment coredns -n kube-system\n\n3. Verified CoreDNS pods\
  \ running:\n   Command: kubectl get pods -n kube-system -l k8s-app=kube-dns\n\n\
  Verification:\n- CoreDNS Pods: 2/2 Running, Ready\n- Internal DNS: kubernetes.default\
  \ → 10.96.0.1 ✅\n- Service Discovery: kube-dns.kube-system → 10.96.0.10 ✅\n- External\
  \ DNS: google.com → resolved ✅\n- DNS latency: < 50ms ✅\n\nAdditional Checks:\n\
  - kube-dns Service: ClusterIP 10.96.0.10, Port 53 UDP/TCP\n- CoreDNS ConfigMap:\
  \ Valid configuration\n- Pod /etc/resolv.conf: nameserver 10.96.0.10\n\nStatus:\
  \ ✅ DNS Fully Operational\nEOF\n\ncat /tmp/dns-fix.txt\n\n# 정리\nkubectl delete pod\
  \ dns-test\n```\n"
explanation: "클러스터 DNS 문제 해결을 평가합니다.\n\nKubernetes DNS 아키텍처:\n\n1. **CoreDNS**:\n\
  \   - 클러스터 DNS 서버\n   - Deployment로 배포 (보통 2개 replica)\n   - kube-system 네임스페이스\n\
  \   - 레이블: k8s-app=kube-dns\n\n2. **kube-dns Service**:\n   - ClusterIP: 보통 10.96.0.10\
  \ (첫 번째 서비스 IP)\n   - Port: 53 (UDP/TCP)\n   - CoreDNS Pod로 트래픽 전달\n\n3. **Pod DNS\
  \ 설정**:\n   - /etc/resolv.conf에 자동 설정\n   - nameserver: kube-dns Service IP\n  \
  \ - search: <namespace>.svc.cluster.local svc.cluster.local cluster.local\n\nDNS\
  \ 이름 형식:\n\n```\n# Service\n<service-name>.<namespace>.svc.cluster.local\n예: my-service.default.svc.cluster.local\n\
  \n# 같은 네임스페이스에서는 짧게\nmy-service\n\n# 다른 네임스페이스\nmy-service.other-namespace\n\n#\
  \ Pod (headless service)\n<pod-ip-dashes>.<service-name>.<namespace>.svc.cluster.local\n\
  예: 10-244-0-5.my-service.default.svc.cluster.local\n```\n\n일반적인 DNS 문제:\n\n1. **CoreDNS\
  \ CrashLoopBackOff**:\n   - ConfigMap 오류\n   - 리소스 부족 (OOM)\n   - 플러그인 충돌\n   -\
  \ Loop 감지\n\n2. **kube-dns Service 문제**:\n   - Service 없음\n   - 잘못된 ClusterIP\n\
  \   - Selector 불일치\n   - Endpoints 없음\n\n3. **Forward 루프**:\n   ```\n   forward\
  \ . 127.0.0.1  # 잘못됨!\n   forward . /etc/resolv.conf  # 올바름\n   ```\n\n4. **NetworkPolicy\
  \ 차단**:\n   - DNS 트래픽 (UDP/TCP 53) 차단\n   - CoreDNS로 접근 불가\n\n5. **kubelet 설정 오류**:\n\
  \   - --cluster-dns 플래그 잘못됨\n   - kube-dns Service IP와 불일치\n\n6. **Pod dnsPolicy\
  \ 잘못됨**:\n   - Default: 노드 DNS 사용\n   - ClusterFirst: 클러스터 DNS 사용 (기본)\n   - ClusterFirstWithHostNet:\
  \ hostNetwork + 클러스터 DNS\n   - None: dnsConfig로 수동 설정\n\nCoreDNS 디버깅:\n\n```bash\n\
  # 1. Pod 상태\nkubectl get pods -n kube-system -l k8s-app=kube-dns\n\n# 2. 로그 확인\n\
  kubectl logs -n kube-system -l k8s-app=kube-dns\n\n# 3. ConfigMap 확인\nkubectl get\
  \ cm coredns -n kube-system -o yaml\n\n# 4. Service 확인\nkubectl get svc kube-dns\
  \ -n kube-system\nkubectl describe svc kube-dns -n kube-system\n\n# 5. Endpoints\
  \ 확인\nkubectl get endpoints kube-dns -n kube-system\n\n# 6. DNS 쿼리 테스트\nkubectl\
  \ run -it --rm debug --image=busybox --restart=Never -- nslookup kubernetes.default\n\
  \n# 7. CoreDNS 메트릭\nkubectl port-forward -n kube-system <coredns-pod> 9153:9153\n\
  curl localhost:9153/metrics\n```\n\nCoreDNS ConfigMap 주요 설정:\n\n```\n.:53 {\n  \
  \  errors                 # 에러 로깅\n    health                 # 헬스 체크 (포트 8080)\n\
  \    ready                  # Readiness 체크 (포트 8181)\n    kubernetes cluster.local\
  \ in-addr.arpa ip6.arpa {\n        pods insecure      # Pod DNS 레코드 생성\n       \
  \ fallthrough        # 다음 플러그인으로\n        ttl 30             # TTL 30초\n    }\n\
  \    prometheus :9153       # 메트릭\n    forward . /etc/resolv.conf  # 외부 DNS 포워딩\n\
  \    cache 30               # 캐시 30초\n    loop                   # 루프 감지\n    reload\
  \                 # 자동 리로드\n    loadbalance            # 로드밸런싱\n}\n```\n\nPod DNS\
  \ 정책:\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: custom-dns\nspec:\n\
  \  dnsPolicy: ClusterFirst  # 기본값\n  dnsConfig:               # 추가 설정\n    nameservers:\n\
  \    - 8.8.8.8\n    searches:\n    - my.dns.search.suffix\n    options:\n    - name:\
  \ ndots\n      value: \"2\"\n```\n\n실무 팁:\n- CoreDNS는 최소 2개 replica 권장\n- /etc/resolv.conf의\
  \ nameserver 확인\n- loop 플러그인으로 순환 참조 방지\n- cache로 성능 향상\n- NodeLocal DNSCache 사용\
  \ 고려 (대규모 클러스터)\n\n트러블슈팅 체크리스트:\n- [ ] CoreDNS Pod Running 상태 확인\n- [ ] CoreDNS\
  \ 로그 오류 확인\n- [ ] kube-dns Service 존재 및 Endpoints 확인\n- [ ] CoreDNS ConfigMap 설정\
  \ 확인\n- [ ] Pod /etc/resolv.conf 확인\n- [ ] NetworkPolicy DNS 차단 확인\n- [ ] kubelet\
  \ --cluster-dns 설정 확인\n"
references:
- https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/
- https://coredns.io/plugins/kubernetes/
context: cluster3

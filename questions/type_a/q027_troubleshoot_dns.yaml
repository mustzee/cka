id: "A027"
title: "클러스터 DNS 문제 해결"
domain: "Troubleshooting"
difficulty: "medium"
weight: 7
time_estimate: 12

description: |
  Context: kubectl config use-context cluster1

  클러스터 내 Pod들이 서로 DNS 이름으로 통신할 수 없습니다.
  Service 이름 확인이 실패하고 있으며, CoreDNS에 문제가 있는 것으로 보입니다.

task: |
  다음 작업을 수행하세요:

  1. 클러스터 DNS 문제를 진단하세요

  2. DNS가 정상 작동하도록 문제를 해결하세요

  3. DNS 정상 작동을 검증하세요:
     - kubernetes.default.svc.cluster.local 조회 성공
     - 외부 도메인 (google.com) 조회 성공

  4. 진단 과정과 해결 방법을 /tmp/dns-fix.txt에 저장하세요

hints:
  - "CoreDNS Pod 상태 확인"
  - "kube-dns Service 확인"
  - "CoreDNS ConfigMap 확인"
  - "Pod의 /etc/resolv.conf 확인"

validation:
  checks:
    - custom_check: |
        # CoreDNS Pod가 Running 상태인지 확인
        COREDNS_RUNNING=$(kubectl get pods -n kube-system -l k8s-app=kube-dns -o jsonpath='{.items[*].status.phase}' | grep -c Running || echo 0)
        if [ "$COREDNS_RUNNING" -ge 1 ]; then
          echo "PASS"
        else
          echo "FAIL: CoreDNS pods are not running"
        fi

    - custom_check: |
        # kube-dns Service가 존재하는지 확인
        kubectl get svc kube-dns -n kube-system &>/dev/null
        if [ $? -eq 0 ]; then
          echo "PASS"
        else
          echo "FAIL: kube-dns service not found"
        fi

    - file: "/tmp/dns-fix.txt"
      exists: true

solution: |
  클러스터 DNS 문제 해결:

  ```bash
  # 1. DNS 문제 확인
  # 테스트 Pod 생성
  kubectl run dns-test --image=busybox:latest --restart=Never -- sleep 3600

  # DNS 조회 테스트
  kubectl exec dns-test -- nslookup kubernetes.default
  # 실패: server can't find kubernetes.default: NXDOMAIN

  kubectl exec dns-test -- nslookup google.com
  # 실패하거나 느림

  # 2. CoreDNS Pod 상태 확인
  kubectl get pods -n kube-system -l k8s-app=kube-dns
  # NAME                       READY   STATUS    RESTARTS   AGE
  # coredns-5d78c9869d-abcde   0/1     CrashLoopBackOff   5          10m

  kubectl describe pod -n kube-system -l k8s-app=kube-dns
  # Events: Back-off restarting failed container

  kubectl logs -n kube-system -l k8s-app=kube-dns
  # 오류 메시지 확인

  # 3. 일반적인 DNS 문제들:

  # 문제 1: CoreDNS Pod가 CrashLoopBackOff
  # 원인: ConfigMap 오류, 플러그인 설정 문제

  # CoreDNS ConfigMap 확인
  kubectl get configmap coredns -n kube-system -o yaml

  # 잘못된 설정 예시:
  # - forward 루프
  # - 잘못된 upstream DNS
  # - 플러그인 충돌

  # 해결: ConfigMap 수정
  kubectl edit configmap coredns -n kube-system

  # 정상 설정 예시:
  # .:53 {
  #     errors
  #     health {
  #        lameduck 5s
  #     }
  #     ready
  #     kubernetes cluster.local in-addr.arpa ip6.arpa {
  #        pods insecure
  #        fallthrough in-addr.arpa ip6.arpa
  #        ttl 30
  #     }
  #     prometheus :9153
  #     forward . /etc/resolv.conf {
  #        max_concurrent 1000
  #     }
  #     cache 30
  #     loop
  #     reload
  #     loadbalance
  # }

  # CoreDNS Pod 재시작
  kubectl rollout restart deployment coredns -n kube-system

  # 문제 2: kube-dns Service 없음
  kubectl get svc kube-dns -n kube-system
  # Error: service "kube-dns" not found

  # 해결: Service 생성
  cat <<EOF | kubectl apply -f -
  apiVersion: v1
  kind: Service
  metadata:
    name: kube-dns
    namespace: kube-system
    labels:
      k8s-app: kube-dns
      kubernetes.io/name: "CoreDNS"
  spec:
    selector:
      k8s-app: kube-dns
    clusterIP: 10.96.0.10  # 클러스터 DNS IP (확인 필요)
    ports:
    - name: dns
      port: 53
      protocol: UDP
      targetPort: 53
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53
  EOF

  # 문제 3: Service ClusterIP가 잘못됨
  # kubelet 설정 확인
  kubectl get pods -n kube-system -l k8s-app=kube-dns -o wide

  # kubelet의 --cluster-dns 플래그 확인
  ps aux | grep kubelet | grep cluster-dns
  # 또는
  systemctl cat kubelet | grep cluster-dns

  # Service ClusterIP와 kubelet 설정 일치 확인
  kubectl get svc kube-dns -n kube-system -o jsonpath='{.spec.clusterIP}'
  # 10.96.0.10이어야 함 (기본값, 클러스터마다 다를 수 있음)

  # 문제 4: CoreDNS 리소스 부족
  kubectl describe pod -n kube-system -l k8s-app=kube-dns
  # OOMKilled, Evicted 확인

  # 해결: 리소스 제한 증가
  kubectl edit deployment coredns -n kube-system
  # resources.limits.memory: 170Mi → 256Mi

  # 문제 5: NetworkPolicy 차단
  kubectl get networkpolicies --all-namespaces
  # CoreDNS 트래픽을 차단하는 정책 확인

  # 해결: NetworkPolicy 수정 또는 삭제

  # 문제 6: Pod의 DNS 설정 오류
  kubectl exec dns-test -- cat /etc/resolv.conf
  # nameserver 10.96.0.10
  # search default.svc.cluster.local svc.cluster.local cluster.local
  # options ndots:5

  # dnsPolicy 확인
  kubectl get pod dns-test -o jsonpath='{.spec.dnsPolicy}'
  # ClusterFirst (기본값)

  # 4. DNS 검증

  # CoreDNS Pod 상태 확인
  kubectl get pods -n kube-system -l k8s-app=kube-dns
  # Ready 1/1, Running

  # Service DNS 조회
  kubectl exec dns-test -- nslookup kubernetes.default
  # 성공: kubernetes.default.svc.cluster.local has address 10.96.0.1

  kubectl exec dns-test -- nslookup kubernetes.default.svc.cluster.local
  # 성공

  # 다른 네임스페이스 Service
  kubectl exec dns-test -- nslookup kube-dns.kube-system
  # 성공

  # 외부 도메인
  kubectl exec dns-test -- nslookup google.com
  # 성공

  # 5. 결과 저장
  cat > /tmp/dns-fix.txt << 'EOF'
  Cluster DNS Troubleshooting Report
  ==================================

  Problem Found:
  - DNS lookups failing for both cluster services and external domains
  - CoreDNS pods in CrashLoopBackOff state
  - Error in logs: "plugin/loop: Loop detected for zone ."

  Root Cause:
  - CoreDNS ConfigMap had incorrect forward configuration
  - forward . 127.0.0.1 was creating a loop
  - CoreDNS was forwarding DNS queries to itself

  Solution Applied:
  1. Fixed CoreDNS ConfigMap:
     - Changed: forward . 127.0.0.1
     - To: forward . /etc/resolv.conf

     Command: kubectl edit configmap coredns -n kube-system

  2. Restarted CoreDNS deployment:
     Command: kubectl rollout restart deployment coredns -n kube-system

  3. Verified CoreDNS pods running:
     Command: kubectl get pods -n kube-system -l k8s-app=kube-dns

  Verification:
  - CoreDNS Pods: 2/2 Running, Ready
  - Internal DNS: kubernetes.default → 10.96.0.1 ✅
  - Service Discovery: kube-dns.kube-system → 10.96.0.10 ✅
  - External DNS: google.com → resolved ✅
  - DNS latency: < 50ms ✅

  Additional Checks:
  - kube-dns Service: ClusterIP 10.96.0.10, Port 53 UDP/TCP
  - CoreDNS ConfigMap: Valid configuration
  - Pod /etc/resolv.conf: nameserver 10.96.0.10

  Status: ✅ DNS Fully Operational
  EOF

  cat /tmp/dns-fix.txt

  # 정리
  kubectl delete pod dns-test
  ```

explanation: |
  클러스터 DNS 문제 해결을 평가합니다.

  Kubernetes DNS 아키텍처:

  1. **CoreDNS**:
     - 클러스터 DNS 서버
     - Deployment로 배포 (보통 2개 replica)
     - kube-system 네임스페이스
     - 레이블: k8s-app=kube-dns

  2. **kube-dns Service**:
     - ClusterIP: 보통 10.96.0.10 (첫 번째 서비스 IP)
     - Port: 53 (UDP/TCP)
     - CoreDNS Pod로 트래픽 전달

  3. **Pod DNS 설정**:
     - /etc/resolv.conf에 자동 설정
     - nameserver: kube-dns Service IP
     - search: <namespace>.svc.cluster.local svc.cluster.local cluster.local

  DNS 이름 형식:

  ```
  # Service
  <service-name>.<namespace>.svc.cluster.local
  예: my-service.default.svc.cluster.local

  # 같은 네임스페이스에서는 짧게
  my-service

  # 다른 네임스페이스
  my-service.other-namespace

  # Pod (headless service)
  <pod-ip-dashes>.<service-name>.<namespace>.svc.cluster.local
  예: 10-244-0-5.my-service.default.svc.cluster.local
  ```

  일반적인 DNS 문제:

  1. **CoreDNS CrashLoopBackOff**:
     - ConfigMap 오류
     - 리소스 부족 (OOM)
     - 플러그인 충돌
     - Loop 감지

  2. **kube-dns Service 문제**:
     - Service 없음
     - 잘못된 ClusterIP
     - Selector 불일치
     - Endpoints 없음

  3. **Forward 루프**:
     ```
     forward . 127.0.0.1  # 잘못됨!
     forward . /etc/resolv.conf  # 올바름
     ```

  4. **NetworkPolicy 차단**:
     - DNS 트래픽 (UDP/TCP 53) 차단
     - CoreDNS로 접근 불가

  5. **kubelet 설정 오류**:
     - --cluster-dns 플래그 잘못됨
     - kube-dns Service IP와 불일치

  6. **Pod dnsPolicy 잘못됨**:
     - Default: 노드 DNS 사용
     - ClusterFirst: 클러스터 DNS 사용 (기본)
     - ClusterFirstWithHostNet: hostNetwork + 클러스터 DNS
     - None: dnsConfig로 수동 설정

  CoreDNS 디버깅:

  ```bash
  # 1. Pod 상태
  kubectl get pods -n kube-system -l k8s-app=kube-dns

  # 2. 로그 확인
  kubectl logs -n kube-system -l k8s-app=kube-dns

  # 3. ConfigMap 확인
  kubectl get cm coredns -n kube-system -o yaml

  # 4. Service 확인
  kubectl get svc kube-dns -n kube-system
  kubectl describe svc kube-dns -n kube-system

  # 5. Endpoints 확인
  kubectl get endpoints kube-dns -n kube-system

  # 6. DNS 쿼리 테스트
  kubectl run -it --rm debug --image=busybox --restart=Never -- nslookup kubernetes.default

  # 7. CoreDNS 메트릭
  kubectl port-forward -n kube-system <coredns-pod> 9153:9153
  curl localhost:9153/metrics
  ```

  CoreDNS ConfigMap 주요 설정:

  ```
  .:53 {
      errors                 # 에러 로깅
      health                 # 헬스 체크 (포트 8080)
      ready                  # Readiness 체크 (포트 8181)
      kubernetes cluster.local in-addr.arpa ip6.arpa {
          pods insecure      # Pod DNS 레코드 생성
          fallthrough        # 다음 플러그인으로
          ttl 30             # TTL 30초
      }
      prometheus :9153       # 메트릭
      forward . /etc/resolv.conf  # 외부 DNS 포워딩
      cache 30               # 캐시 30초
      loop                   # 루프 감지
      reload                 # 자동 리로드
      loadbalance            # 로드밸런싱
  }
  ```

  Pod DNS 정책:

  ```yaml
  apiVersion: v1
  kind: Pod
  metadata:
    name: custom-dns
  spec:
    dnsPolicy: ClusterFirst  # 기본값
    dnsConfig:               # 추가 설정
      nameservers:
      - 8.8.8.8
      searches:
      - my.dns.search.suffix
      options:
      - name: ndots
        value: "2"
  ```

  실무 팁:
  - CoreDNS는 최소 2개 replica 권장
  - /etc/resolv.conf의 nameserver 확인
  - loop 플러그인으로 순환 참조 방지
  - cache로 성능 향상
  - NodeLocal DNSCache 사용 고려 (대규모 클러스터)

  트러블슈팅 체크리스트:
  - [ ] CoreDNS Pod Running 상태 확인
  - [ ] CoreDNS 로그 오류 확인
  - [ ] kube-dns Service 존재 및 Endpoints 확인
  - [ ] CoreDNS ConfigMap 설정 확인
  - [ ] Pod /etc/resolv.conf 확인
  - [ ] NetworkPolicy DNS 차단 확인
  - [ ] kubelet --cluster-dns 설정 확인

references:
  - "https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/"
  - "https://coredns.io/plugins/kubernetes/"

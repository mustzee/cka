id: A025
title: etcd 백업 및 복원
domain: Troubleshooting
difficulty: hard
weight: 8
time_estimate: 15
description: 'Context: kubectl config use-context cluster1


  클러스터의 etcd 데이터베이스를 백업하고 복원하는 작업이 필요합니다.

  재해 복구 시나리오에 대비하여 etcd 스냅샷을 생성하고 복원해야 합니다.

  '
task: "다음 작업을 수행하세요:\n\n1. etcd 스냅샷을 생성하여 /tmp/etcd-backup.db에 저장하세요\n\n2. etcd 정보:\n\
  \   - ETCD 엔드포인트: https://127.0.0.1:2379\n   - CA 인증서: /etc/kubernetes/pki/etcd/ca.crt\n\
  \   - 서버 인증서: /etc/kubernetes/pki/etcd/server.crt\n   - 서버 키: /etc/kubernetes/pki/etcd/server.key\n\
  \n3. 백업이 성공적으로 생성되었는지 확인하세요\n\n4. (선택) 백업 복원 절차를 /tmp/restore-procedure.txt에 작성하세요\n"
hints:
- etcdctl snapshot save 명령어 사용
- ETCDCTL_API=3 환경변수 설정
- 인증서 경로 정확히 지정
- control-plane 노드에서 실행
validation:
  checks:
  - file: /tmp/etcd-backup.db
    exists: true
  - custom_check: "# 백업 파일 크기 확인 (0보다 커야 함)\nif [ -f /tmp/etcd-backup.db ] && [ -s\
      \ /tmp/etcd-backup.db ]; then\n  echo \"PASS\"\nelse\n  echo \"FAIL: Backup\
      \ file is empty or does not exist\"\nfi\n"
solution: "etcd 백업 및 복원:\n\n```bash\n# 1. etcd 정보 확인\n# Control-plane 노드에 접속\nkubectl\
  \ get pods -n kube-system | grep etcd\n\n# etcd Pod 상세 정보 확인\nkubectl describe pod\
  \ etcd-<node-name> -n kube-system\n\n# 2. etcdctl 버전 확인\nETCDCTL_API=3 etcdctl version\n\
  \n# etcdctl이 없다면 설치 (control-plane 노드에서)\n# apt-get install etcd-client\n# 또는 etcd\
  \ Pod 내부에서 실행\n\n# 3. etcd 스냅샷 생성\nETCDCTL_API=3 etcdctl snapshot save /tmp/etcd-backup.db\
  \ \\\n  --endpoints=https://127.0.0.1:2379 \\\n  --cacert=/etc/kubernetes/pki/etcd/ca.crt\
  \ \\\n  --cert=/etc/kubernetes/pki/etcd/server.crt \\\n  --key=/etc/kubernetes/pki/etcd/server.key\n\
  \n# 출력 예시:\n# {\"level\":\"info\",\"ts\":...,\"msg\":\"created temporary db file\"\
  ,...}\n# {\"level\":\"info\",\"ts\":...,\"msg\":\"fetching snapshot\",...}\n# {\"\
  level\":\"info\",\"ts\":...,\"msg\":\"fetched snapshot\",...}\n# Snapshot saved\
  \ at /tmp/etcd-backup.db\n\n# 4. 백업 검증\nETCDCTL_API=3 etcdctl snapshot status /tmp/etcd-backup.db\
  \ \\\n  --write-out=table\n\n# 출력:\n# +----------+----------+------------+------------+\n\
  # |   HASH   | REVISION | TOTAL KEYS | TOTAL SIZE |\n# +----------+----------+------------+------------+\n\
  # | 12345678 |    12345 |       1234 |      5.2MB |\n# +----------+----------+------------+------------+\n\
  \n# 5. 백업 파일 확인\nls -lh /tmp/etcd-backup.db\n# -rw------- 1 root root 5.2M Nov 20\
  \ 10:30 /tmp/etcd-backup.db\n\n# 6. 복원 절차 문서화\ncat > /tmp/restore-procedure.txt\
  \ << 'EOF'\netcd 백업 복원 절차\n====================\n\n1. 복원 전 준비:\n   - 모든 API 서버 중지\n\
  \   - etcd 데이터 디렉토리 백업\n\n2. 스냅샷 복원:\n   ETCDCTL_API=3 etcdctl snapshot restore\
  \ /tmp/etcd-backup.db \\\n     --data-dir=/var/lib/etcd-restored \\\n     --initial-cluster=<cluster-config>\
  \ \\\n     --initial-advertise-peer-urls=<peer-urls>\n\n3. etcd 설정 업데이트:\n   - /etc/kubernetes/manifests/etcd.yaml\
  \ 수정\n   - hostPath를 /var/lib/etcd-restored로 변경\n\n4. etcd 재시작:\n   - Static Pod이므로\
  \ 자동 재시작됨\n   - kubectl get pods -n kube-system -w로 확인\n\n5. 클러스터 상태 확인:\n   - kubectl\
  \ get nodes\n   - kubectl get pods --all-namespaces\n   - 복원된 리소스 확인\n\n주의사항:\n\
  - 복원은 클러스터 전체 중단을 초래\n- 프로덕션 환경에서는 신중히 수행\n- 복원 전 현재 상태 백업 권장\nEOF\n\ncat /tmp/restore-procedure.txt\n\
  \n# 7. (추가) etcd Pod 내부에서 백업하기\n# Control-plane 노드에서:\nkubectl exec -n kube-system\
  \ etcd-<node-name> -- \\\n  etcdctl --endpoints=https://127.0.0.1:2379 \\\n  --cacert=/etc/kubernetes/pki/etcd/ca.crt\
  \ \\\n  --cert=/etc/kubernetes/pki/etcd/server.crt \\\n  --key=/etc/kubernetes/pki/etcd/server.key\
  \ \\\n  snapshot save /tmp/etcd-backup.db\n\n# Pod에서 호스트로 복사\nkubectl cp kube-system/etcd-<node-name>:/tmp/etcd-backup.db\
  \ /tmp/etcd-backup.db\n```\n\n**실제 복원 예시** (시험에서는 복원까지 요구할 수 있음):\n\n```bash\n#\
  \ 1. 복원 수행\nETCDCTL_API=3 etcdctl snapshot restore /tmp/etcd-backup.db \\\n  --data-dir=/var/lib/etcd-from-backup\n\
  \n# 2. etcd 설정 변경\nsudo vim /etc/kubernetes/manifests/etcd.yaml\n\n# volumes 섹션\
  \ 수정:\n# volumes:\n# - hostPath:\n#     path: /var/lib/etcd-from-backup  # 변경\n\
  #     type: DirectoryOrCreate\n#   name: etcd-data\n\n# 3. etcd Pod 자동 재시작 대기\n\
  kubectl get pods -n kube-system -w\n\n# 4. 클러스터 확인\nkubectl get nodes\nkubectl get\
  \ pods --all-namespaces\n```\n"
explanation: "etcd 백업 및 복원을 평가합니다.\n\netcd란:\n- Kubernetes의 모든 클러스터 데이터 저장\n- 분산 키-값\
  \ 저장소\n- Control-plane 컴포넌트\n- 고가용성 및 일관성 보장\n\n저장되는 데이터:\n- 모든 Kubernetes 리소스 (Pods,\
  \ Services, ConfigMaps 등)\n- 클러스터 구성 정보\n- Secrets (암호화된 상태)\n- RBAC 정책\n\netcdctl\
  \ 명령어:\n\n1. snapshot save:\n   - 현재 etcd 상태를 파일로 저장\n   - 클러스터 운영 중에도 가능\n   -\
  \ 일관된 스냅샷 보장\n\n2. snapshot status:\n   - 스냅샷 정보 확인\n   - 해시, 리비전, 키 개수, 크기\n\n\
  3. snapshot restore:\n   - 스냅샷에서 데이터 복원\n   - 새 데이터 디렉토리 생성\n   - 클러스터 중단 필요\n\n\
  인증서 파일:\n```\n/etc/kubernetes/pki/etcd/\n├── ca.crt              # CA 인증서\n├── ca.key\
  \              # CA 키\n├── server.crt          # 서버 인증서\n├── server.key        \
  \  # 서버 키\n├── peer.crt            # Peer 인증서\n└── peer.key            # Peer 키\n\
  ```\n\n환경변수:\n- ETCDCTL_API=3: API 버전 3 사용 (필수)\n- ETCDCTL_CACERT: CA 인증서\n- ETCDCTL_CERT:\
  \ 클라이언트 인증서\n- ETCDCTL_KEY: 클라이언트 키\n- ETCDCTL_ENDPOINTS: etcd 엔드포인트\n\n백업 전략:\n\
  \n1. 정기 백업:\n   - Cron으로 자동화\n   - 일일/주간 백업\n   - 원격 저장소에 보관\n\n2. 백업 스크립트:\n  \
  \ ```bash\n   #!/bin/bash\n   DATE=$(date +%Y%m%d_%H%M%S)\n   BACKUP_DIR=\"/backup/etcd\"\
  \n   BACKUP_FILE=\"$BACKUP_DIR/etcd-$DATE.db\"\n\n   mkdir -p $BACKUP_DIR\n\n  \
  \ ETCDCTL_API=3 etcdctl snapshot save $BACKUP_FILE \\\n     --endpoints=https://127.0.0.1:2379\
  \ \\\n     --cacert=/etc/kubernetes/pki/etcd/ca.crt \\\n     --cert=/etc/kubernetes/pki/etcd/server.crt\
  \ \\\n     --key=/etc/kubernetes/pki/etcd/server.key\n\n   # 7일 이상 된 백업 삭제\n   find\
  \ $BACKUP_DIR -name \"etcd-*.db\" -mtime +7 -delete\n   ```\n\n3. 백업 보관:\n   - 로컬\
  \ + 원격 저장소\n   - S3, GCS, Azure Blob\n   - 암호화 권장\n\n복원 시나리오:\n\n1. 리소스 실수 삭제:\n\
  \   - 네임스페이스 전체 삭제\n   - 중요 ConfigMap/Secret 삭제\n   - 백업에서 복원\n\n2. 클러스터 재해:\n \
  \  - Control-plane 노드 장애\n   - etcd 데이터 손실\n   - 새 클러스터에 복원\n\n3. 마이그레이션:\n   -\
  \ 클러스터 이전\n   - 버전 업그레이드 전 백업\n\n주의사항:\n- 복원은 클러스터를 백업 시점으로 되돌림\n- 백업 후 생성된 모든 리소스\
  \ 손실\n- 프로덕션에서는 신중히 수행\n- 복원 전 현재 상태 백업 권장\n\n실무 팁:\n- 정기적인 백업 자동화 (cron)\n- 백업\
  \ 테스트 정기 수행\n- 복원 절차 문서화\n- 백업 보관 정책 수립 (30일, 90일 등)\n- 원격 저장소에 보관\n- 암호화 고려\n\n\
  트러블슈팅:\n```bash\n# 인증서 오류\n# Error: context deadline exceeded\n# → 인증서 경로 확인\n\n\
  # 권한 오류\n# permission denied\n# → root 또는 sudo로 실행\n\n# etcdctl 없음\n# command not\
  \ found\n# → etcd Pod 내부에서 실행 또는 설치\n```\n"
references:
- https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/
- https://etcd.io/docs/latest/op-guide/recovery/
context: cluster1

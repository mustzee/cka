id: A004
title: Pod 트러블슈팅
domain: Troubleshooting
difficulty: medium
weight: 6
time_estimate: 10
description: 'Context: kubectl config use-context cluster1


  default 네임스페이스에 broken-app이라는 이름의 Pod가 있지만 제대로 작동하지 않습니다.

  '
task: '다음 작업을 수행하세요:


  1. broken-app Pod의 문제를 확인하고 수정하세요

  2. Pod가 Running 상태가 되도록 하세요

  3. /tmp/fix-log.txt 파일에 발견한 문제와 해결 방법을 기록하세요


  참고: Pod는 이미 생성되어 있습니다.

  '
hints:
- kubectl describe pod 명령어로 이벤트 확인
- kubectl logs 명령어로 로그 확인
- 이미지 이름, 리소스 제한, 환경 변수 등을 확인하세요
validation:
  checks:
  - resource: pod
    name: broken-app
    namespace: default
    conditions:
    - type: Ready
      status: 'True'
  - file: /tmp/fix-log.txt
    exists: true
solution: "해결 방법:\n\n```bash\n# 1. Pod 상태 확인\nkubectl get pod broken-app\nkubectl\
  \ describe pod broken-app\n\n# 2. 문제 확인 (예: 이미지 이름 오타)\n# Events를 보면 ImagePullBackOff\
  \ 또는 CrashLoopBackOff 등\n\n# 3. Pod YAML 확인 및 수정\nkubectl get pod broken-app -o\
  \ yaml > /tmp/broken-app.yaml\n\n# 4. Pod 삭제\nkubectl delete pod broken-app\n\n\
  # 5. 수정된 YAML로 재생성\n# 예: nginx:latests -> nginx:latest로 수정\ncat <<EOF | kubectl\
  \ apply -f -\napiVersion: v1\nkind: Pod\nmetadata:\n  name: broken-app\nspec:\n\
  \  containers:\n  - name: nginx\n    image: nginx:latest\nEOF\n\n# 6. 문제 해결 로그 작성\n\
  cat <<EOF > /tmp/fix-log.txt\n문제: ImagePullBackOff - 잘못된 이미지 이름\n원인: nginx:latests\
  \ (오타)\n해결: nginx:latest로 수정\nEOF\n\n# 7. 확인\nkubectl get pod broken-app\n```\n"
explanation: "이 문제는 Pod 트러블슈팅 능력을 평가합니다.\n\n일반적인 Pod 문제:\n1. ImagePullBackOff: 이미지를\
  \ 가져올 수 없음\n   - 이미지 이름 오타\n   - 레지스트리 인증 실패\n   - 이미지가 존재하지 않음\n\n2. CrashLoopBackOff:\
  \ 컨테이너가 반복적으로 실패\n   - 애플리케이션 오류\n   - 잘못된 명령어\n   - 필수 환경 변수 누락\n\n3. Pending:\
  \ Pod가 스케줄링되지 않음\n   - 리소스 부족\n   - NodeSelector 불일치\n   - PVC 바인딩 실패\n\n트러블슈팅 단계:\n\
  1. kubectl get pod - 현재 상태 확인\n2. kubectl describe pod - 이벤트 및 상세 정보\n3. kubectl\
  \ logs - 컨테이너 로그\n4. kubectl events - 클러스터 이벤트\n"
references:
- https://kubernetes.io/docs/tasks/debug/debug-application/
context: cluster4

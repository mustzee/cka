id: A007
title: ConfigMap 생성 및 Pod에 마운트
domain: Cluster Architecture
difficulty: easy
weight: 4
time_estimate: 6
description: 'Context: kubectl config use-context cluster1


  애플리케이션 설정을 ConfigMap으로 관리하고 Pod에서 사용해야 합니다.

  '
task: "다음 작업을 수행하세요:\n\n1. ConfigMap 생성:\n   - 이름: app-config\n   - 네임스페이스: default\n\
  \   - 데이터:\n     * app.properties: \"env=production\\nlog_level=info\"\n     * database.url:\
  \ \"mysql://db.example.com:3306\"\n\n2. Pod 생성:\n   - 이름: config-test-pod\n   -\
  \ 이미지: busybox:latest\n   - 명령어: sleep 3600\n   - ConfigMap을 /etc/config 디렉토리에 볼륨으로\
  \ 마운트\n"
hints:
- kubectl create configmap 명령어 사용
- volumes와 volumeMounts 필드 사용
validation:
  checks:
  - resource: configmap
    name: app-config
    namespace: default
  - resource: pod
    name: config-test-pod
    namespace: default
solution: "해결 방법:\n\n```bash\n# ConfigMap 생성\nkubectl create configmap app-config\
  \ \\\n  --from-literal=database.url=mysql://db.example.com:3306 \\\n  -n default\n\
  \n# app.properties 파일 생성 후 추가\necho -e \"env=production\\nlog_level=info\" > /tmp/app.properties\n\
  kubectl create configmap app-config \\\n  --from-file=/tmp/app.properties \\\n \
  \ --from-literal=database.url=mysql://db.example.com:3306 \\\n  -n default \\\n\
  \  --dry-run=client -o yaml | kubectl apply -f -\n\n# 또는 YAML로 직접 생성\ncat <<EOF\
  \ | kubectl apply -f -\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: app-config\n\
  \  namespace: default\ndata:\n  app.properties: |\n    env=production\n    log_level=info\n\
  \  database.url: \"mysql://db.example.com:3306\"\nEOF\n\n# Pod 생성\ncat <<EOF | kubectl\
  \ apply -f -\napiVersion: v1\nkind: Pod\nmetadata:\n  name: config-test-pod\n  namespace:\
  \ default\nspec:\n  containers:\n  - name: busybox\n    image: busybox:latest\n\
  \    command: [\"sleep\", \"3600\"]\n    volumeMounts:\n    - name: config-volume\n\
  \      mountPath: /etc/config\n  volumes:\n  - name: config-volume\n    configMap:\n\
  \      name: app-config\nEOF\n\n# 확인\nkubectl get configmap app-config -o yaml\n\
  kubectl exec config-test-pod -- ls /etc/config\nkubectl exec config-test-pod --\
  \ cat /etc/config/app.properties\n```\n"
explanation: '이 문제는 ConfigMap을 통한 설정 관리를 평가합니다.


  ConfigMap 사용 방법:

  1. 환경 변수로 주입

  2. 명령줄 인자로 사용

  3. 볼륨으로 마운트 (파일로 사용)


  ConfigMap 생성 방법:

  - --from-literal: 직접 키-값 지정

  - --from-file: 파일에서 읽기

  - --from-env-file: 환경 변수 파일

  - YAML 매니페스트


  실무 적용:

  - 환경별 설정 분리 (dev, staging, prod)

  - 설정 변경 시 이미지 재빌드 불필요

  - 민감 정보는 Secret 사용


  주의사항:

  - ConfigMap은 암호화되지 않음

  - 크기 제한: 1MB

  - ConfigMap 변경 시 Pod 재시작 필요 (일부 경우)

  '
references:
- https://kubernetes.io/docs/concepts/configuration/configmap/
context: cluster1

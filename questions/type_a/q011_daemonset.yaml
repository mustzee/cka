id: A011
title: DaemonSet 생성 및 관리
domain: Workloads & Scheduling
difficulty: medium
weight: 5
time_estimate: 8
description: 'Context: kubectl config use-context cluster1


  모든 워커 노드에서 실행되어야 하는 모니터링 에이전트를 배포해야 합니다.

  '
task: '다음 요구사항을 만족하는 DaemonSet을 생성하세요:


  - 이름: node-monitor

  - 네임스페이스: kube-system

  - 이미지: busybox:latest

  - 명령어: ["sh", "-c", "while true; do echo monitoring; sleep 30; done"]

  - 레이블: app=node-monitor, type=monitoring

  - 워커 노드에만 배포 (node-type=worker 레이블 사용)

  '
hints:
- nodeSelector로 특정 노드 선택 가능
- DaemonSet은 각 노드당 1개 Pod만 실행
validation:
  checks:
  - resource: daemonset
    name: node-monitor
    namespace: kube-system
solution: "해결 방법:\n\n```bash\n# DaemonSet 생성\ncat <<EOF | kubectl apply -f -\napiVersion:\
  \ apps/v1\nkind: DaemonSet\nmetadata:\n  name: node-monitor\n  namespace: kube-system\n\
  \  labels:\n    app: node-monitor\nspec:\n  selector:\n    matchLabels:\n      app:\
  \ node-monitor\n  template:\n    metadata:\n      labels:\n        app: node-monitor\n\
  \        type: monitoring\n    spec:\n      nodeSelector:\n        node-type: worker\n\
  \      containers:\n      - name: monitor\n        image: busybox:latest\n     \
  \   command:\n        - sh\n        - -c\n        - while true; do echo monitoring;\
  \ sleep 30; done\nEOF\n\n# 확인\nkubectl get daemonset -n kube-system\nkubectl get\
  \ pods -n kube-system -l app=node-monitor -o wide\n\n# 각 워커 노드에 1개씩 Pod가 실행되는지 확인\n\
  kubectl get nodes -l node-type=worker\n```\n"
explanation: "DaemonSet을 통한 노드별 Pod 배포를 평가합니다.\n\nDaemonSet이란:\n- 모든 (또는 일부) 노드에 Pod\
  \ 복사본 실행\n- 노드 추가 시 자동으로 Pod 추가\n- 노드 제거 시 자동으로 Pod 삭제\n\n사용 사례:\n1. 노드 모니터링 (node-exporter,\
  \ cAdvisor)\n2. 로그 수집 (fluentd, logstash)\n3. 네트워크 (CNI 플러그인)\n4. 스토리지 (ceph, glusterfs)\n\
  \nvs Deployment:\n- Deployment: 전체 클러스터에 N개 복제본\n- DaemonSet: 각 노드에 1개씩\n\n노드 선택:\n\
  1. nodeSelector: 간단한 레이블 매칭\n2. affinity: 고급 규칙\n3. tolerations: Taint 허용\n\n업데이트\
  \ 전략:\n1. RollingUpdate (기본):\n   - 한 번에 하나씩 업데이트\n   - maxUnavailable 설정 가능\n\n\
  2. OnDelete:\n   - 수동 삭제 시에만 업데이트\n   - 제어된 업데이트 가능\n\n실무 팁:\n- 리소스 제한 설정 필수\n-\
  \ hostNetwork, hostPID 사용 가능\n- 보안 고려 (특권 필요 시)\n"
references:
- https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/
context: cluster5

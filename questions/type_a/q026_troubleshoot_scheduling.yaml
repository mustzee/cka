id: A026
title: Pod 스케줄링 실패 트러블슈팅
domain: Troubleshooting
difficulty: medium
weight: 7
time_estimate: 12
description: 'Context: kubectl config use-context cluster1


  production 네임스페이스의 web-app Pod가 Pending 상태에서 스케줄링되지 않습니다.

  Pod가 정상적으로 스케줄링되도록 문제를 진단하고 해결해야 합니다.

  '
task: "다음 작업을 수행하세요:\n\n1. web-app Pod의 스케줄링 실패 원인을 진단하세요\n\n2. 문제를 해결하여 Pod가 Running\
  \ 상태가 되도록 하세요\n\n3. 진단 결과와 해결 방법을 /tmp/scheduling-fix.txt에 저장하세요\n   - 발견한 문제\n\
  \   - 근본 원인\n   - 적용한 해결책\n   - 검증 결과\n\n참고: Pod는 이미 생성되어 있으며, 여러 가지 스케줄링 문제가 있을\
  \ 수 있습니다.\n"
hints:
- kubectl describe pod로 이벤트 확인
- '스케줄러 메시지 확인: Insufficient resources, node selector, taints'
- 노드 상태 및 리소스 확인
- Pod 요구사항 vs 노드 가용성
validation:
  checks:
  - custom_check: "# Pod가 Running 상태인지 확인\nPOD_STATUS=$(kubectl get pod web-app -n\
      \ production -o jsonpath='{.status.phase}' 2>/dev/null || echo \"NotFound\"\
      )\nif [ \"$POD_STATUS\" = \"Running\" ]; then\n  echo \"PASS\"\nelse\n  echo\
      \ \"FAIL: Pod status is $POD_STATUS, expected Running\"\nfi\n"
  - file: /tmp/scheduling-fix.txt
    exists: true
solution: "Pod 스케줄링 실패 트러블슈팅:\n\n```bash\n# 1. Pod 상태 확인\nkubectl get pod web-app\
  \ -n production\n# NAME      READY   STATUS    RESTARTS   AGE\n# web-app   0/1 \
  \    Pending   0          5m\n\n# 2. 상세 정보 및 이벤트 확인 (가장 중요!)\nkubectl describe pod\
  \ web-app -n production\n\n# Events 섹션에서 스케줄링 실패 원인 확인:\n# - FailedScheduling: 0/3\
  \ nodes are available: 1 Insufficient cpu, 2 node(s) didn't match Pod's node affinity/selector\n\
  # - FailedScheduling: 0/3 nodes are available: 3 node(s) had taint {key=value},\
  \ that the pod didn't tolerate\n\n# 3. 일반적인 스케줄링 실패 원인들:\n\n# 원인 1: 리소스 부족 (Insufficient\
  \ resources)\n# 진단:\nkubectl describe pod web-app -n production | grep -A 10 \"\
  Events:\"\n# FailedScheduling: Insufficient cpu/memory\n\nkubectl describe nodes\n\
  # Allocated resources 섹션 확인\n\nkubectl top nodes  # metrics-server 필요\n\n# 해결:\n\
  # - Pod 리소스 요청 줄이기\nkubectl edit pod web-app -n production\n# resources.requests.cpu:\
  \ 4 → 500m\n# resources.requests.memory: 8Gi → 1Gi\n\n# 또는 Pod 삭제 후 재생성\nkubectl\
  \ delete pod web-app -n production\ncat <<EOF | kubectl apply -f -\napiVersion:\
  \ v1\nkind: Pod\nmetadata:\n  name: web-app\n  namespace: production\nspec:\n  containers:\n\
  \  - name: nginx\n    image: nginx:latest\n    resources:\n      requests:\n   \
  \     cpu: 100m\n        memory: 128Mi\n      limits:\n        cpu: 200m\n     \
  \   memory: 256Mi\nEOF\n\n# 원인 2: NodeSelector 불일치\n# 진단:\nkubectl get pod web-app\
  \ -n production -o yaml | grep -A 5 nodeSelector\n# nodeSelector:\n#   disktype:\
  \ ssd\n\nkubectl get nodes --show-labels | grep disktype\n# 노드에 해당 레이블이 없음!\n\n\
  # 해결 방법 A: 노드에 레이블 추가\nkubectl label nodes <node-name> disktype=ssd\n\n# 해결 방법 B:\
  \ Pod의 nodeSelector 제거\nkubectl get pod web-app -n production -o yaml > /tmp/web-app.yaml\n\
  # nodeSelector 제거 후 재생성\nkubectl delete pod web-app -n production\nkubectl apply\
  \ -f /tmp/web-app.yaml\n\n# 원인 3: Taints/Tolerations 문제\n# 진단:\nkubectl describe\
  \ nodes | grep -A 5 Taints\n# Taints: node-role.kubernetes.io/master:NoSchedule\n\
  \nkubectl get pod web-app -n production -o yaml | grep -A 5 tolerations\n# tolerations:\
  \ []  # Toleration 없음!\n\n# 해결: Pod에 Toleration 추가\nkubectl get pod web-app -n production\
  \ -o yaml > /tmp/web-app.yaml\n# tolerations 추가 후 재생성:\n# tolerations:\n# - key:\
  \ \"node-role.kubernetes.io/master\"\n#   operator: \"Exists\"\n#   effect: \"NoSchedule\"\
  \n\nkubectl delete pod web-app -n production\nkubectl apply -f /tmp/web-app.yaml\n\
  \n# 원인 4: Node Affinity 불일치\n# 진단:\nkubectl get pod web-app -n production -o yaml\
  \ | grep -A 10 affinity\n\n# 해결: affinity 규칙 수정 또는 노드 레이블 추가\n\n# 원인 5: PVC Pending\
  \ 상태\n# 진단:\nkubectl get pvc -n production\nkubectl describe pod web-app -n production\n\
  # Warning: FailedMount: persistentvolumeclaim \"data\" not found\n\n# 해결: PVC 생성\
  \ 또는 볼륨 제거\n\n# 원인 6: 모든 노드가 Unschedulable\n# 진단:\nkubectl get nodes\n# STATUS:\
  \ Ready,SchedulingDisabled\n\n# 해결:\nkubectl uncordon <node-name>\n\n# 4. Pod 상태\
  \ 확인 (Running이 될 때까지 대기)\nkubectl get pod web-app -n production -w\n\n# 5. 최종 검증\n\
  kubectl get pod web-app -n production\nkubectl describe pod web-app -n production\n\
  \n# 6. 결과 저장\ncat > /tmp/scheduling-fix.txt << 'EOF'\nPod Scheduling Troubleshooting\
  \ Report\n=====================================\n\nPod: web-app (production namespace)\n\
  \nProblem Found:\n- Pod was in Pending state due to scheduling failure\n- Event:\
  \ \"0/3 nodes are available: 2 Insufficient cpu, 1 node(s) didn't match Pod's node\
  \ affinity\"\n\nRoot Cause:\n1. Pod requested 4 CPU cores, but no node had sufficient\
  \ available CPU\n2. Pod had nodeSelector: disktype=ssd, but no node had this label\n\
  \nSolution Applied:\n1. Reduced Pod CPU request from 4 cores to 500m\n2. Added disktype=ssd\
  \ label to worker-node-1\n   Command: kubectl label nodes worker-node-1 disktype=ssd\n\
  \nVerification:\n- Pod Status: Running\n- Scheduled Node: worker-node-1\n- Container\
  \ Status: Ready 1/1\n- No error events in last 5 minutes\n\nCommands Used:\n1. kubectl\
  \ describe pod web-app -n production\n2. kubectl top nodes\n3. kubectl get nodes\
  \ --show-labels\n4. kubectl label nodes worker-node-1 disktype=ssd\n5. kubectl edit\
  \ pod web-app -n production\n\nStatus: ✅ Resolved\nEOF\n\ncat /tmp/scheduling-fix.txt\n\
  ```\n"
explanation: "Pod 스케줄링 실패 트러블슈팅을 평가합니다.\n\n스케줄링 프로세스:\n1. User가 Pod 생성 요청\n2. API\
  \ Server가 etcd에 저장\n3. Scheduler가 적합한 Node 선택\n4. Kubelet이 Pod 실행\n\n스케줄링 실패 주요\
  \ 원인:\n\n1. **리소스 부족** (가장 흔함):\n   ```\n   Event: 0/3 nodes available: 3 Insufficient\
  \ cpu\n   Event: 0/3 nodes available: 3 Insufficient memory\n   ```\n   - Pod requests\
  \ > Node 가용 리소스\n   - 해결: requests 줄이기 또는 노드 추가\n\n2. **NodeSelector 불일치**:\n  \
  \ ```yaml\n   nodeSelector:\n     disktype: ssd\n     zone: us-west\n   ```\n  \
  \ - Pod의 nodeSelector와 매칭되는 노드 없음\n   - 해결: 노드에 레이블 추가 또는 selector 수정\n\n3. **Taints/Tolerations**:\n\
  \   ```\n   Node Taint: key=value:NoSchedule\n   Pod: No matching toleration\n \
  \  ```\n   - 노드에 taint가 있지만 Pod에 toleration 없음\n   - 해결: Pod에 toleration 추가\n\n\
  4. **Node Affinity**:\n   ```yaml\n   affinity:\n     nodeAffinity:\n       requiredDuringSchedulingIgnoredDuringExecution:\n\
  \         nodeSelectorTerms:\n         - matchExpressions:\n           - key: kubernetes.io/hostname\n\
  \             operator: In\n             values:\n             - specific-node\n\
  \   ```\n   - 조건을 만족하는 노드 없음\n   - 해결: affinity 규칙 완화 또는 노드 레이블 추가\n\n5. **PVC 문제**:\n\
  \   ```\n   Event: persistentvolumeclaim \"data-pvc\" not found\n   Event: no persistent\
  \ volumes available\n   ```\n   - Pod가 요구하는 PVC가 Pending 또는 없음\n   - 해결: PVC 생성\
  \ 또는 PV 추가\n\n6. **Unschedulable Node**:\n   ```bash\n   kubectl cordon <node> \
  \ # 스케줄링 비활성화\n   ```\n   - 노드가 SchedulingDisabled 상태\n   - 해결: kubectl uncordon\
  \ <node>\n\n7. **Pod Priority/Preemption**:\n   - 높은 우선순위 Pod가 리소스 차지\n   - 낮은 우선순위\
  \ Pod가 스케줄링 안 됨\n\n진단 명령어:\n\n```bash\n# 1. Pod 이벤트 확인 (가장 중요!)\nkubectl describe\
  \ pod <pod-name> -n <namespace>\n\n# 2. 노드 리소스 확인\nkubectl describe nodes\nkubectl\
  \ top nodes\n\n# 3. 노드 레이블 확인\nkubectl get nodes --show-labels\n\n# 4. 노드 Taints\
  \ 확인\nkubectl describe nodes | grep Taints\n\n# 5. PVC 상태 확인\nkubectl get pvc -n\
  \ <namespace>\n\n# 6. 스케줄러 로그 확인\nkubectl logs -n kube-system <scheduler-pod>\n\n\
  # 7. Pod 스펙 확인\nkubectl get pod <pod-name> -n <namespace> -o yaml\n```\n\n스케줄러 이벤트\
  \ 메시지:\n\n```\n# 리소스 부족\n\"0/3 nodes are available: 2 Insufficient cpu, 1 Insufficient\
  \ memory\"\n\n# NodeSelector\n\"0/3 nodes are available: 3 node(s) didn't match\
  \ Pod's node affinity/selector\"\n\n# Taints\n\"0/3 nodes are available: 3 node(s)\
  \ had taint {key: value}, that the pod didn't tolerate\"\n\n# Unschedulable\n\"\
  0/3 nodes are available: 3 node(s) were unschedulable\"\n\n# Volume\n\"pod has unbound\
  \ immediate PersistentVolumeClaims\"\n```\n\n실무 패턴:\n\n1. **우선순위 디버깅 순서**:\n   ```bash\n\
  \   kubectl describe pod  # 이벤트 확인\n   kubectl describe nodes  # 노드 상태\n   kubectl\
  \ get nodes --show-labels  # 레이블\n   kubectl top nodes  # 리소스 사용량\n   ```\n\n2.\
  \ **빠른 수정**:\n   ```bash\n   # requests 제거 (테스트용)\n   kubectl patch pod <pod> -p\
  \ '{\"spec\":{\"containers\":[{\"name\":\"<container>\",\"resources\":{\"requests\"\
  :null}}]}}'\n\n   # nodeSelector 제거\n   kubectl patch pod <pod> -p '{\"spec\":{\"\
  nodeSelector\":null}}'\n   ```\n\n3. **노드 준비**:\n   ```bash\n   # 레이블 추가\n   kubectl\
  \ label nodes <node> disktype=ssd\n\n   # Taint 제거\n   kubectl taint nodes <node>\
  \ key=value:NoSchedule-\n\n   # Cordon 해제\n   kubectl uncordon <node>\n   ```\n\n\
  트러블슈팅 체크리스트:\n- [ ] Pod describe 확인 (Events 섹션)\n- [ ] 노드 리소스 가용성 확인\n- [ ] NodeSelector\
  \ 레이블 매칭 확인\n- [ ] Taints/Tolerations 확인\n- [ ] Node Affinity 규칙 확인\n- [ ] PVC 상태\
  \ 확인\n- [ ] 노드 Schedulable 상태 확인\n\n실무 팁:\n- Events는 가장 중요한 정보원\n- top 명령어로 실제 사용량\
  \ 확인\n- requests는 스케줄링 기준, limits는 실행 제한\n- nodeSelector보다 affinity가 더 유연\n- 프로덕션에서는\
  \ requests 설정 권장\n"
references:
- https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
- https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/
context: cluster2

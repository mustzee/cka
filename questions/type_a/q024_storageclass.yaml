id: A024
title: StorageClass를 사용한 동적 볼륨 프로비저닝
domain: Storage
difficulty: medium
weight: 5
time_estimate: 8
description: 'Context: kubectl config use-context cluster1


  애플리케이션마다 다른 스토리지 성능 요구사항을 만족시켜야 합니다.

  StorageClass를 사용하여 동적으로 볼륨을 프로비저닝해야 합니다.

  '
task: "다음 작업을 수행하세요:\n\n1. StorageClass 생성:\n   - 이름: fast-storage\n   - Provisioner:\
  \ kubernetes.io/no-provisioner (로컬 테스트용)\n   - volumeBindingMode: WaitForFirstConsumer\n\
  \   - reclaimPolicy: Retain\n\n2. PersistentVolumeClaim 생성:\n   - 이름: app-fast-pvc\n\
  \   - 네임스페이스: default\n   - StorageClass: fast-storage\n   - 크기: 500Mi\n   - 접근\
  \ 모드: ReadWriteOnce\n\n3. PersistentVolume 생성 (수동, no-provisioner이므로):\n   - 이름:\
  \ local-pv-fast\n   - StorageClass: fast-storage\n   - 크기: 500Mi\n   - 접근 모드: ReadWriteOnce\n\
  \   - hostPath: /mnt/fast-storage\n\n4. Pod 생성하여 PVC 사용:\n   - 이름: app-with-storage\n\
  \   - 네임스페이스: default\n   - 이미지: nginx:latest\n   - 볼륨 마운트: /data (app-fast-pvc\
  \ 사용)\n"
hints:
- StorageClass는 동적 프로비저닝 정책 정의
- WaitForFirstConsumer는 Pod 스케줄링 후 바인딩
- no-provisioner는 수동 PV 필요
- 실제 환경에서는 AWS EBS, GCE PD 등 사용
validation:
  checks:
  - resource: storageclass
    name: fast-storage
  - resource: persistentvolumeclaim
    name: app-fast-pvc
    namespace: default
  - resource: persistentvolume
    name: local-pv-fast
  - resource: pod
    name: app-with-storage
    namespace: default
  - custom_check: "# PVC가 Bound 상태인지 확인\nPVC_STATUS=$(kubectl get pvc app-fast-pvc\
      \ -n default -o jsonpath='{.status.phase}')\nif [ \"$PVC_STATUS\" = \"Bound\"\
      \ ]; then\n  echo \"PASS\"\nelse\n  echo \"FAIL: PVC status is $PVC_STATUS,\
      \ expected Bound\"\nfi\n"
solution: "StorageClass와 동적 볼륨 프로비저닝:\n\n```bash\n# 1. StorageClass 생성\ncat <<EOF\
  \ | kubectl apply -f -\napiVersion: storage.k8s.io/v1\nkind: StorageClass\nmetadata:\n\
  \  name: fast-storage\nprovisioner: kubernetes.io/no-provisioner\nvolumeBindingMode:\
  \ WaitForFirstConsumer\nreclaimPolicy: Retain\nEOF\n\n# 2. PersistentVolume 생성 (no-provisioner이므로\
  \ 수동)\ncat <<EOF | kubectl apply -f -\napiVersion: v1\nkind: PersistentVolume\n\
  metadata:\n  name: local-pv-fast\nspec:\n  capacity:\n    storage: 500Mi\n  accessModes:\n\
  \  - ReadWriteOnce\n  persistentVolumeReclaimPolicy: Retain\n  storageClassName:\
  \ fast-storage\n  hostPath:\n    path: /mnt/fast-storage\n    type: DirectoryOrCreate\n\
  EOF\n\n# 3. PersistentVolumeClaim 생성\ncat <<EOF | kubectl apply -f -\napiVersion:\
  \ v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: app-fast-pvc\n  namespace:\
  \ default\nspec:\n  accessModes:\n  - ReadWriteOnce\n  storageClassName: fast-storage\n\
  \  resources:\n    requests:\n      storage: 500Mi\nEOF\n\n# 4. Pod 생성\ncat <<EOF\
  \ | kubectl apply -f -\napiVersion: v1\nkind: Pod\nmetadata:\n  name: app-with-storage\n\
  \  namespace: default\nspec:\n  containers:\n  - name: nginx\n    image: nginx:latest\n\
  \    volumeMounts:\n    - name: data\n      mountPath: /data\n  volumes:\n  - name:\
  \ data\n    persistentVolumeClaim:\n      claimName: app-fast-pvc\nEOF\n\n# 5. 확인\n\
  kubectl get storageclass fast-storage\nkubectl get pv local-pv-fast\nkubectl get\
  \ pvc app-fast-pvc\nkubectl get pod app-with-storage\n\n# PVC 상태 확인 (Bound 여야 함)\n\
  kubectl describe pvc app-fast-pvc\n\n# Pod에서 볼륨 사용 확인\nkubectl exec app-with-storage\
  \ -- df -h /data\nkubectl exec app-with-storage -- touch /data/test.txt\nkubectl\
  \ exec app-with-storage -- ls -la /data\n\n# 6. StorageClass 상세 정보\nkubectl describe\
  \ storageclass fast-storage\n```\n"
explanation: "StorageClass를 사용한 동적 볼륨 프로비저닝을 평가합니다.\n\nStorageClass란:\n- 스토리지 \"클래스\"\
  \ 정의\n- 관리자가 다양한 스토리지 타입 제공\n- 동적 프로비저닝 가능\n- PVC가 자동으로 PV 생성 요청\n\n주요 필드:\n\n1.\
  \ Provisioner:\n   - 볼륨 생성을 담당하는 플러그인\n   - 클라우드 제공자별 상이:\n     * AWS: ebs.csi.aws.com\n\
  \     * GCP: pd.csi.storage.gke.io\n     * Azure: disk.csi.azure.com\n     * 로컬:\
  \ kubernetes.io/no-provisioner\n\n2. volumeBindingMode:\n   - Immediate (기본값):\n\
  \     * PVC 생성 즉시 PV 바인딩\n     * Pod 스케줄링 전\n     * 존(Zone) 불일치 가능\n\n   - WaitForFirstConsumer:\n\
  \     * Pod 스케줄링 후 바인딩\n     * Pod와 같은 존에 볼륨 생성\n     * 권장 방식\n\n3. reclaimPolicy:\n\
  \   - Delete (기본값):\n     * PVC 삭제 시 PV도 삭제\n     * 데이터 영구 손실\n\n   - Retain:\n\
  \     * PVC 삭제 시 PV 유지\n     * 수동 정리 필요\n     * 데이터 보호\n\n4. allowVolumeExpansion:\n\
  \   - true: PVC 크기 증가 가능\n   - false: 크기 고정\n\n동적 프로비저닝 흐름:\n```\n1. StorageClass\
  \ 생성 (관리자)\n2. PVC 생성 → StorageClass 지정\n3. Provisioner가 PV 자동 생성\n4. PVC와 PV 자동\
  \ 바인딩\n5. Pod가 PVC 사용\n```\n\n실제 클라우드 환경 예시:\n\nAWS EBS StorageClass:\n```yaml\n\
  apiVersion: storage.k8s.io/v1\nkind: StorageClass\nmetadata:\n  name: fast-ebs\n\
  provisioner: ebs.csi.aws.com\nparameters:\n  type: gp3  # gp2, io1, io2\n  iopsPerGB:\
  \ \"10\"\n  encrypted: \"true\"\nvolumeBindingMode: WaitForFirstConsumer\nallowVolumeExpansion:\
  \ true\n```\n\nGCP Persistent Disk:\n```yaml\napiVersion: storage.k8s.io/v1\nkind:\
  \ StorageClass\nmetadata:\n  name: fast-pd\nprovisioner: pd.csi.storage.gke.io\n\
  parameters:\n  type: pd-ssd  # pd-standard, pd-balanced\n  replication-type: regional-pd\n\
  volumeBindingMode: WaitForFirstConsumer\n```\n\nPVC에서 StorageClass 사용:\n```yaml\n\
  apiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: my-pvc\nspec:\n\
  \  storageClassName: fast-storage  # 지정\n  accessModes:\n  - ReadWriteOnce\n  resources:\n\
  \    requests:\n      storage: 10Gi\n```\n\n기본 StorageClass:\n```bash\n# 기본 StorageClass\
  \ 설정\nkubectl patch storageclass fast-storage \\\n  -p '{\"metadata\": {\"annotations\"\
  :{\"storageclass.kubernetes.io/is-default-class\":\"true\"}}}'\n\n# 기본 StorageClass\
  \ 확인\nkubectl get storageclass\n# NAME           PROVISIONER              ...\n\
  # fast-storage (default)  kubernetes.io/...\n\n# PVC에서 storageClassName 생략 시 기본값\
  \ 사용\n```\n\n볼륨 확장:\n```yaml\n# StorageClass에 allowVolumeExpansion: true 설정 필요\n\
  # PVC 수정\nkubectl edit pvc app-fast-pvc\n# spec.resources.requests.storage: 500Mi\
  \ → 1Gi\n\n# 확장 확인\nkubectl get pvc app-fast-pvc -w\n```\n\n트러블슈팅:\n```bash\n# PVC가\
  \ Pending 상태\nkubectl describe pvc <pvc-name>\n# - StorageClass 없음\n# - 적절한 PV 없음\n\
  # - Provisioner 오류\n\n# 이벤트 확인\nkubectl get events --sort-by='.lastTimestamp'\n\n\
  # StorageClass 목록\nkubectl get storageclass\n```\n\n실무 팁:\n- 프로덕션: WaitForFirstConsumer\
  \ + Retain\n- 개발: Immediate + Delete\n- 중요 데이터: reclaimPolicy: Retain\n- 볼륨 확장 필요\
  \ 시: allowVolumeExpansion: true\n"
references:
- https://kubernetes.io/docs/concepts/storage/storage-classes/
- https://kubernetes.io/docs/concepts/storage/dynamic-provisioning/
context: cluster6

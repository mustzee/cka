id: A002
title: Service 생성 및 구성
domain: Services & Networking
difficulty: easy
weight: 4
time_estimate: 5
description: 'Context: kubectl config use-context cluster1


  production 네임스페이스의 web-server Deployment에 접근하기 위한 Service를 생성해야 합니다.

  '
task: '다음 요구사항을 만족하는 Service를 생성하세요:


  - 이름: web-service

  - 네임스페이스: production

  - 타입: NodePort

  - 포트: 80

  - 타겟 포트: 80

  - NodePort: 30080

  - 셀렉터: app=web

  '
hints:
- kubectl expose 또는 kubectl create service 사용 가능
- NodePort 범위는 30000-32767입니다
validation:
  checks:
  - resource: service
    name: web-service
    namespace: production
    conditions:
    - field: spec.type
      value: NodePort
    - field: spec.ports[0].port
      value: 80
    - field: spec.ports[0].nodePort
      value: 30080
solution: "해결 방법:\n\n```bash\n# Service 생성 (명령형)\nkubectl expose deployment web-server\
  \ \\\n  --name=web-service \\\n  --type=NodePort \\\n  --port=80 \\\n  --target-port=80\
  \ \\\n  -n production\n\n# NodePort 수정\nkubectl patch service web-service -n production\
  \ \\\n  -p '{\"spec\":{\"ports\":[{\"port\":80,\"nodePort\":30080}]}}'\n\n# 또는 YAML\
  \ 파일 사용\ncat <<EOF | kubectl apply -f -\napiVersion: v1\nkind: Service\nmetadata:\n\
  \  name: web-service\n  namespace: production\nspec:\n  type: NodePort\n  selector:\n\
  \    app: web\n  ports:\n  - port: 80\n    targetPort: 80\n    nodePort: 30080\n\
  EOF\n\n# 확인\nkubectl get service web-service -n production\ncurl localhost:30080\n\
  ```\n"
explanation: '이 문제는 Service를 통한 네트워킹 구성 능력을 평가합니다.


  핵심 개념:

  - Service는 Pod에 대한 안정적인 네트워크 엔드포인트를 제공합니다

  - NodePort는 모든 노드의 특정 포트로 서비스를 노출합니다

  - 셀렉터를 통해 트래픽을 라우팅할 Pod를 선택합니다


  Service 타입:

  - ClusterIP: 클러스터 내부에서만 접근 (기본값)

  - NodePort: 노드의 포트로 외부 노출

  - LoadBalancer: 클라우드 로드밸런서 사용

  - ExternalName: DNS CNAME 레코드

  '
references:
- https://kubernetes.io/docs/concepts/services-networking/service/
context: cluster2

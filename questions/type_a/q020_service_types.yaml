id: A020
title: 다양한 Service 타입 구성
domain: Services & Networking
difficulty: easy
weight: 5
time_estimate: 10
description: 'Context: kubectl config use-context cluster1


  하나의 애플리케이션을 다양한 Service 타입으로 노출해야 합니다.

  각 Service 타입의 특성을 이해하고 올바르게 구성해야 합니다.

  '
task: "production 네임스페이스에 다음 Service들을 생성하세요:\n\n1. Internal Service (ClusterIP):\n\
  \   - 이름: db-service\n   - Selector: app=database\n   - Port: 5432\n   - TargetPort:\
  \ 5432\n   - Type: ClusterIP\n\n2. NodePort Service:\n   - 이름: api-nodeport\n  \
  \ - Selector: app=api\n   - Port: 8080\n   - TargetPort: 8080\n   - NodePort: 30080\n\
  \   - Type: NodePort\n\n3. LoadBalancer Service:\n   - 이름: web-loadbalancer\n  \
  \ - Selector: app=web\n   - Port: 80\n   - TargetPort: 8000\n   - Type: LoadBalancer\n\
  \n참고: Pod들은 이미 적절한 label로 생성되어 있습니다.\n"
hints:
- kubectl expose --help로 기본 구조 확인
- ClusterIP는 기본 타입
- NodePort는 30000-32767 범위
- type 필드로 Service 타입 지정
validation:
  checks:
  - resource: service
    name: db-service
    namespace: production
    type: ClusterIP
  - resource: service
    name: api-nodeport
    namespace: production
    type: NodePort
  - resource: service
    name: web-loadbalancer
    namespace: production
    type: LoadBalancer
solution: "Service 생성:\n\n```bash\n# 1. ClusterIP Service (내부 통신용)\nkubectl create\
  \ service clusterip db-service \\\n  --tcp=5432:5432 \\\n  -n production --dry-run=client\
  \ -o yaml | \\\n  kubectl set selector --local -f - 'app=database' -o yaml | \\\n\
  \  kubectl apply -f -\n\n# 또는 YAML로:\ncat <<EOF | kubectl apply -f -\napiVersion:\
  \ v1\nkind: Service\nmetadata:\n  name: db-service\n  namespace: production\nspec:\n\
  \  type: ClusterIP\n  selector:\n    app: database\n  ports:\n  - port: 5432\n \
  \   targetPort: 5432\n    protocol: TCP\nEOF\n\n# 2. NodePort Service (외부 접근 - 노드\
  \ IP:포트)\ncat <<EOF | kubectl apply -f -\napiVersion: v1\nkind: Service\nmetadata:\n\
  \  name: api-nodeport\n  namespace: production\nspec:\n  type: NodePort\n  selector:\n\
  \    app: api\n  ports:\n  - port: 8080\n    targetPort: 8080\n    nodePort: 30080\n\
  \    protocol: TCP\nEOF\n\n# 3. LoadBalancer Service (외부 접근 - 로드밸런서)\ncat <<EOF\
  \ | kubectl apply -f -\napiVersion: v1\nkind: Service\nmetadata:\n  name: web-loadbalancer\n\
  \  namespace: production\nspec:\n  type: LoadBalancer\n  selector:\n    app: web\n\
  \  ports:\n  - port: 80\n    targetPort: 8000\n    protocol: TCP\nEOF\n\n# 확인\n\
  kubectl get svc -n production\nkubectl get svc -n production -o wide\n\n# ClusterIP\
  \ 테스트 (클러스터 내부에서만)\nkubectl run test --rm -i --tty --image=busybox -n production\
  \ -- \\\n  wget -O- http://db-service:5432\n\n# NodePort 테스트\nNODE_IP=$(kubectl\
  \ get nodes -o jsonpath='{.items[0].status.addresses[0].address}')\ncurl http://$NODE_IP:30080\n\
  \n# LoadBalancer 테스트\nLB_IP=$(kubectl get svc web-loadbalancer -n production -o\
  \ jsonpath='{.status.loadBalancer.ingress[0].ip}')\ncurl http://$LB_IP\n\n# Service\
  \ Endpoints 확인 (실제 Pod IP)\nkubectl get endpoints -n production\nkubectl describe\
  \ endpoints db-service -n production\n```\n\nService 타입 비교:\n```yaml\n# ClusterIP\
  \ (기본값)\n- 용도: 클러스터 내부 통신\n- 접근: 클러스터 내부에서만\n- IP: 가상 IP (Cluster IP)\n- 예: 데이터베이스,\
  \ 내부 API\n\n# NodePort\n- 용도: 외부에서 직접 접근\n- 접근: <NodeIP>:<NodePort>\n- 포트 범위: 30000-32767\n\
  - ClusterIP도 자동 생성됨\n- 예: 개발/테스트 환경\n\n# LoadBalancer\n- 용도: 프로덕션 외부 접근\n- 접근: 로드밸런서\
  \ IP\n- 클라우드 제공자 필요\n- NodePort + ClusterIP 자동 생성\n- 예: 웹 애플리케이션, API Gateway\n\n\
  # ExternalName (참고)\n- 용도: 외부 DNS 이름 매핑\n- 접근: DNS CNAME\n- Selector 없음\n- 예: 외부\
  \ 데이터베이스\n```\n"
explanation: "다양한 Service 타입 구성을 평가합니다.\n\nService 타입별 특징:\n\n1. ClusterIP (기본):\n\
  \   - 클러스터 내부에서만 접근 가능\n   - 가상 IP 할당\n   - DNS로 접근 (service-name.namespace.svc.cluster.local)\n\
  \   - 가장 안전하고 기본적인 타입\n\n2. NodePort:\n   - 모든 노드의 특정 포트로 접근 가능\n   - 포트 범위 제한 (30000-32767)\n\
  \   - ClusterIP도 함께 생성됨\n   - 방화벽 설정 필요\n\n3. LoadBalancer:\n   - 외부 로드밸런서 프로비저닝\n\
  \   - 클라우드 제공자 필요 (AWS, GCP, Azure)\n   - 공인 IP 할당\n   - NodePort + ClusterIP도 생성됨\n\
  \   - 비용 발생 (클라우드 환경)\n\n4. ExternalName:\n   - 외부 서비스를 DNS 이름으로 매핑\n   - Selector\
  \ 사용 안 함\n   - Endpoint 없음\n\n선택 기준:\n- 내부 통신만: ClusterIP\n- 개발/테스트: NodePort\n\
  - 프로덕션 외부 노출: LoadBalancer\n- 외부 서비스 연결: ExternalName\n\n실무 팁:\n- 데이터베이스는 항상 ClusterIP\n\
  - API는 Ingress + ClusterIP 조합 권장\n- 웹 애플리케이션은 LoadBalancer 또는 Ingress\n- NodePort는\
  \ 임시/개발 용도로만\n\n주의사항:\n- LoadBalancer는 클라우드 환경에서만 External IP 할당\n- On-premise는\
  \ MetalLB 같은 솔루션 필요\n- NodePort는 보안 위험 (모든 노드 노출)\n- Service는 label selector로 Pod\
  \ 선택\n\nDNS 이름:\n- 같은 네임스페이스: <service-name>\n- 다른 네임스페이스: <service-name>.<namespace>\n\
  - 전체 FQDN: <service-name>.<namespace>.svc.cluster.local\n"
references:
- https://kubernetes.io/docs/concepts/services-networking/service/
- https://kubernetes.io/docs/tutorials/services/connect-applications-service/
context: cluster2

id: "A008"
title: "Secret 생성 및 환경변수로 사용"
domain: "Cluster Architecture"
difficulty: "easy"
weight: 4
time_estimate: 6

description: |
  Context: kubectl config use-context cluster1

  애플리케이션의 민감한 정보를 Secret으로 관리해야 합니다.

task: |
  다음 작업을 수행하세요:

  1. Secret 생성:
     - 이름: db-credentials
     - 네임스페이스: default
     - 타입: Opaque
     - 데이터:
       * username: admin
       * password: P@ssw0rd123

  2. Pod 생성:
     - 이름: app-with-secret
     - 이미지: nginx:latest
     - Secret의 username을 DB_USER 환경변수로
     - Secret의 password를 DB_PASSWORD 환경변수로

hints:
  - "kubectl create secret generic 명령어 사용"
  - "env.valueFrom.secretKeyRef 사용"

validation:
  checks:
    - resource: "secret"
      name: "db-credentials"
      namespace: "default"

    - resource: "pod"
      name: "app-with-secret"
      namespace: "default"

solution: |
  해결 방법:

  ```bash
  # Secret 생성
  kubectl create secret generic db-credentials \
    --from-literal=username=admin \
    --from-literal=password=P@ssw0rd123 \
    -n default

  # Pod 생성
  cat <<EOF | kubectl apply -f -
  apiVersion: v1
  kind: Pod
  metadata:
    name: app-with-secret
    namespace: default
  spec:
    containers:
    - name: nginx
      image: nginx:latest
      env:
      - name: DB_USER
        valueFrom:
          secretKeyRef:
            name: db-credentials
            key: username
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: db-credentials
            key: password
  EOF

  # 확인
  kubectl get secret db-credentials -o yaml
  kubectl exec app-with-secret -- env | grep DB_
  ```

explanation: |
  Secret을 사용한 민감 정보 관리를 평가합니다.

  Secret vs ConfigMap:
  - Secret: Base64 인코딩, 민감 정보용
  - ConfigMap: 일반 설정 데이터

  Secret 타입:
  - Opaque: 임의 데이터
  - kubernetes.io/service-account-token
  - kubernetes.io/dockerconfigjson
  - kubernetes.io/tls

  사용 방법:
  1. 환경변수로 주입
  2. 볼륨으로 마운트
  3. imagePullSecrets

  보안 고려사항:
  - etcd 암호화 권장
  - RBAC로 접근 제어
  - External Secrets Operator 사용 고려

references:
  - "https://kubernetes.io/docs/concepts/configuration/secret/"

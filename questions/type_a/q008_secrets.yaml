id: A008
title: Secret 생성 및 환경변수로 사용
domain: Cluster Architecture
difficulty: easy
weight: 4
time_estimate: 6
description: 'Context: kubectl config use-context cluster1


  애플리케이션의 민감한 정보를 Secret으로 관리해야 합니다.

  '
task: "다음 작업을 수행하세요:\n\n1. Secret 생성:\n   - 이름: db-credentials\n   - 네임스페이스: default\n\
  \   - 타입: Opaque\n   - 데이터:\n     * username: admin\n     * password: P@ssw0rd123\n\
  \n2. Pod 생성:\n   - 이름: app-with-secret\n   - 이미지: nginx:latest\n   - Secret의 username을\
  \ DB_USER 환경변수로\n   - Secret의 password를 DB_PASSWORD 환경변수로\n"
hints:
- kubectl create secret generic 명령어 사용
- env.valueFrom.secretKeyRef 사용
validation:
  checks:
  - resource: secret
    name: db-credentials
    namespace: default
  - resource: pod
    name: app-with-secret
    namespace: default
solution: "해결 방법:\n\n```bash\n# Secret 생성\nkubectl create secret generic db-credentials\
  \ \\\n  --from-literal=username=admin \\\n  --from-literal=password=P@ssw0rd123\
  \ \\\n  -n default\n\n# Pod 생성\ncat <<EOF | kubectl apply -f -\napiVersion: v1\n\
  kind: Pod\nmetadata:\n  name: app-with-secret\n  namespace: default\nspec:\n  containers:\n\
  \  - name: nginx\n    image: nginx:latest\n    env:\n    - name: DB_USER\n     \
  \ valueFrom:\n        secretKeyRef:\n          name: db-credentials\n          key:\
  \ username\n    - name: DB_PASSWORD\n      valueFrom:\n        secretKeyRef:\n \
  \         name: db-credentials\n          key: password\nEOF\n\n# 확인\nkubectl get\
  \ secret db-credentials -o yaml\nkubectl exec app-with-secret -- env | grep DB_\n\
  ```\n"
explanation: 'Secret을 사용한 민감 정보 관리를 평가합니다.


  Secret vs ConfigMap:

  - Secret: Base64 인코딩, 민감 정보용

  - ConfigMap: 일반 설정 데이터


  Secret 타입:

  - Opaque: 임의 데이터

  - kubernetes.io/service-account-token

  - kubernetes.io/dockerconfigjson

  - kubernetes.io/tls


  사용 방법:

  1. 환경변수로 주입

  2. 볼륨으로 마운트

  3. imagePullSecrets


  보안 고려사항:

  - etcd 암호화 권장

  - RBAC로 접근 제어

  - External Secrets Operator 사용 고려

  '
references:
- https://kubernetes.io/docs/concepts/configuration/secret/
context: cluster2

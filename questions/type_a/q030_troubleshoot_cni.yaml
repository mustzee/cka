id: A030
title: CNI 네트워크 플러그인 장애 해결
domain: Troubleshooting
difficulty: hard
weight: 10
time_estimate: 18
context: cluster4
description: |
  Context: kubectl config use-context cluster4

  cluster4에서 새로 생성된 Pod들이 ContainerCreating 상태에서 멈춰 있습니다.

  기존 Pod들은 정상 동작하지만, 새 Pod는 네트워크 설정을 받지 못하고 있습니다.

  "failed to find plugin in path" 또는 "network plugin is not ready" 오류가 발생합니다.

task: |
  다음 작업을 수행하세요:

  1. CNI 플러그인 장애를 진단하세요
     - Pod 이벤트 확인
     - CNI 설정 확인
     - kubelet 로그 확인

  2. CNI 장애를 해결하여 Pod가 Running 상태가 되도록 하세요

  3. 테스트 Pod를 생성하여 정상 동작 확인:
     - 이름: network-test
     - 네임스페이스: default
     - 이미지: nginx:latest
     - Pod가 Running 상태여야 함

  4. 진단 및 해결 과정을 /tmp/cni-fix-report.txt에 저장:
     - 발견한 증상
     - 진단 과정
     - 근본 원인
     - 실행한 명령어
     - 해결 방법
     - 검증 결과

hints:
- kubectl describe pod로 이벤트 확인
- /etc/cni/net.d/ 디렉토리 확인
- /opt/cni/bin/ 디렉토리 확인
- CNI 플러그인 파일 권한 확인

validation:
  checks:
  - resource: pod
    name: network-test
    namespace: default
  - custom_check: |
      # network-test Pod가 Running 상태인지 확인
      STATUS=$(kubectl get pod network-test -n default -o jsonpath='{.status.phase}' 2>/dev/null || echo "NotFound")
      if [ "$STATUS" = "Running" ]; then
        echo "PASS"
      else
        echo "FAIL: Pod status is $STATUS, expected Running"
      fi
  - file: /tmp/cni-fix-report.txt
    exists: true
  - custom_check: |
      # ContainerCreating 상태 Pod가 없는지 확인
      CREATING=$(kubectl get pods -A --field-selector=status.phase=Pending -o jsonpath='{.items[?(@.status.containerStatuses[0].state.waiting.reason=="ContainerCreating")].metadata.name}' | wc -w)
      if [ "$CREATING" -eq 0 ]; then
        echo "PASS"
      else
        echo "FAIL: $CREATING pod(s) still in ContainerCreating"
      fi

solution: |
  CNI 네트워크 플러그인 장애 해결:

  ```bash
  # 1. 증상 확인
  kubectl get pods -A
  # 여러 Pod가 ContainerCreating 상태

  # 2. 특정 Pod 상세 확인
  kubectl describe pod <pod-name> -n <namespace>

  # Events 섹션:
  # Warning  FailedCreatePodSandBox  ... Failed to create pod sandbox: ... failed to find plugin "calico" in path [/opt/cni/bin]
  # 또는
  # Warning  NetworkNotReady  ... network is not ready: container runtime network not ready

  # 3. CNI 설정 디렉토리 확인 (control-plane 또는 worker 노드)
  # SSH로 노드 접속
  ssh worker-1

  # CNI 설정 파일 확인
  ls -la /etc/cni/net.d/
  # 10-calico.conflist
  # 또는
  # 10-flannel.conflist

  cat /etc/cni/net.d/10-calico.conflist
  # 또는
  cat /etc/cni/net.d/10-flannel.conflist

  # 4. CNI 바이너리 확인
  ls -la /opt/cni/bin/
  # bandwidth  bridge  calico  dhcp  firewall  flannel  host-device  ...

  # 문제 발견: CNI 바이너리가 없거나 권한 문제

  # 5. 일반적인 원인들

  # 원인 A: CNI 바이너리 없음
  # CNI 플러그인 다시 설치 (예: Calico)
  kubectl apply -f https://docs.projectcalico.org/manifests/calico.yaml

  # 또는 Flannel
  kubectl apply -f https://raw.githubusercontent.com/coreos/flannel/master/Documentation/kube-flannel.yml

  # 원인 B: CNI 바이너리 권한 문제
  sudo chmod +x /opt/cni/bin/*

  # 원인 C: CNI 설정 파일 문제
  # /etc/cni/net.d/ 확인
  sudo ls -la /etc/cni/net.d/

  # 설정 파일이 없으면 재생성
  # (Calico 예시)
  sudo tee /etc/cni/net.d/10-calico.conflist << 'EOF'
  {
    "name": "k8s-pod-network",
    "cniVersion": "0.3.1",
    "plugins": [
      {
        "type": "calico",
        "log_level": "info",
        "datastore_type": "kubernetes",
        "nodename": "__KUBERNETES_NODE_NAME__",
        "mtu": 1440,
        "ipam": {
          "type": "calico-ipam"
        },
        "policy": {
          "type": "k8s"
        },
        "kubernetes": {
          "kubeconfig": "/etc/cni/net.d/calico-kubeconfig"
        }
      }
    ]
  }
  EOF

  # 원인 D: CNI DaemonSet 문제
  kubectl get pods -n kube-system | grep -E 'calico|flannel|weave'

  # CNI Pod가 없거나 CrashLoopBackOff
  kubectl describe pod <cni-pod-name> -n kube-system

  # CNI DaemonSet 재시작
  kubectl rollout restart daemonset calico-node -n kube-system
  # 또는
  kubectl rollout restart daemonset kube-flannel-ds -n kube-system

  # 6. kubelet 재시작 (필요한 경우)
  sudo systemctl restart kubelet

  # 7. 대기 (CNI 초기화 시간)
  sleep 30

  # 8. 테스트 Pod 생성
  cat <<EOF | kubectl apply -f -
  apiVersion: v1
  kind: Pod
  metadata:
    name: network-test
    namespace: default
  spec:
    containers:
    - name: nginx
      image: nginx:latest
  EOF

  # 9. Pod 상태 확인 (Running이 될 때까지)
  kubectl get pod network-test -w

  # 10. Pod 네트워크 확인
  kubectl get pod network-test -o wide
  # IP 주소가 할당되었는지 확인

  # Pod 내부에서 네트워크 테스트
  kubectl exec network-test -- ping -c 3 8.8.8.8
  kubectl exec network-test -- nslookup kubernetes.default

  # 11. 모든 Pod 상태 재확인
  kubectl get pods -A

  # 12. 문서화
  cat > /tmp/cni-fix-report.txt << 'EOF'
  CNI Network Plugin Troubleshooting Report
  ==========================================

  Symptoms Discovered:
  - Multiple pods stuck in ContainerCreating state
  - New pods unable to get IP addresses
  - Error: "failed to find plugin in path"
  - Network plugin not ready

  Diagnostic Process:
  1. kubectl get pods -A → identified pods in ContainerCreating
  2. kubectl describe pod <name> → saw "failed to find plugin" error
  3. SSH'd to worker node
  4. Checked /etc/cni/net.d/ → CNI config files present
  5. Checked /opt/cni/bin/ → CNI binaries missing execute permissions
  6. Checked CNI DaemonSet → calico-node pods running

  Root Cause:
  - CNI plugin binaries in /opt/cni/bin/ did not have execute permissions
  - Likely caused by incorrect file permissions after manual copy or security policy

  Commands Executed:
  1. kubectl get pods -A
  2. kubectl describe pod <pod-name>
  3. ssh worker-1
  4. ls -la /etc/cni/net.d/
  5. ls -la /opt/cni/bin/
  6. sudo chmod +x /opt/cni/bin/*
  7. sudo systemctl restart kubelet
  8. kubectl apply -f - (created network-test pod)
  9. kubectl get pod network-test -w
  10. kubectl exec network-test -- ping 8.8.8.8

  Solution Applied:
  - Added execute permissions to CNI binaries: chmod +x /opt/cni/bin/*
  - Restarted kubelet service to reload CNI plugins
  - Created test pod to verify network connectivity

  Verification Results:
  ✅ network-test pod: Running
  ✅ Pod has IP address: 10.244.2.5
  ✅ Pod can ping external network (8.8.8.8)
  ✅ Pod can resolve DNS (kubernetes.default)
  ✅ No pods in ContainerCreating state
  ✅ All CNI DaemonSet pods running

  Prevention Measures:
  - Use official installation methods for CNI plugins
  - Verify file permissions after manual operations
  - Monitor CNI pod health in kube-system namespace
  - Set up alerts for pods stuck in ContainerCreating
  - Document CNI plugin version and configuration

  Status: ✅ Resolved
  EOF

  cat /tmp/cni-fix-report.txt

  # 13. (추가) 다른 CNI 문제들

  # 문제 A: CNI DaemonSet 없음
  # CNI 플러그인 설치
  kubectl apply -f <cni-manifest-url>

  # 문제 B: CNI 설정 충돌
  # 여러 CNI 설정이 있으면 제거
  sudo rm /etc/cni/net.d/unwanted-config.conflist

  # 문제 C: IPAM 고갈
  # IP 범위 확장 필요
  kubectl edit ippool default-ipv4-ippool  # Calico 예시

  # 문제 D: Network Policy 차단
  kubectl get networkpolicies -A
  kubectl describe networkpolicy <name>
  ```

explanation: |
  CNI (Container Network Interface) 트러블슈팅은 CKA 고급 주제입니다.

  CNI 플러그인 역할:
  - Pod에 IP 주소 할당
  - Pod 간 네트워크 연결
  - Network Policy 구현
  - 서비스 네트워크 제공

  주요 CNI 플러그인:
  - **Calico**: 고성능, Network Policy 지원
  - **Flannel**: 간단, 오버레이 네트워크
  - **Weave Net**: 멀티클라우드 지원
  - **Cilium**: eBPF 기반, 고급 기능
  - **Canal**: Flannel + Calico

  CNI 파일 구조:

  ```
  /etc/cni/net.d/
  └── 10-calico.conflist  # CNI 설정 파일 (우선순위: 숫자 순)

  /opt/cni/bin/
  ├── bandwidth
  ├── bridge
  ├── calico        # CNI 실행 파일
  ├── dhcp
  ├── firewall
  └── ...
  ```

  CNI 장애 주요 원인:

  1. **CNI 바이너리 없음**:
     - /opt/cni/bin/ 비어있음
     - CNI 플러그인 설치 필요

  2. **실행 권한 없음**:
     - ls -la /opt/cni/bin/
     - chmod +x /opt/cni/bin/*

  3. **CNI 설정 파일 없음**:
     - /etc/cni/net.d/ 비어있음
     - CNI 재설치 필요

  4. **CNI DaemonSet 문제**:
     - kubectl get pods -n kube-system
     - CNI Pod CrashLoopBackOff
     - 로그 확인 필요

  5. **IPAM 고갈**:
     - IP 주소 범위 부족
     - Pod IP 할당 불가

  6. **Network Policy 차단**:
     - 과도한 제한
     - CNI 통신 차단

  진단 명령어:

  ```bash
  # Pod 네트워크 상태
  kubectl get pods -A -o wide
  kubectl describe pod <name>

  # CNI 설정 (노드에서)
  ls -la /etc/cni/net.d/
  cat /etc/cni/net.d/*.conflist

  # CNI 바이너리 (노드에서)
  ls -la /opt/cni/bin/

  # CNI DaemonSet
  kubectl get daemonsets -n kube-system
  kubectl get pods -n kube-system | grep -E 'calico|flannel|weave'

  # CNI 로그
  kubectl logs <cni-pod> -n kube-system

  # kubelet 로그 (노드에서)
  journalctl -u kubelet | grep -i cni

  # 네트워크 확인
  kubectl run test --image=nginx --restart=Never
  kubectl get pod test -o wide
  kubectl exec test -- ip addr
  kubectl exec test -- ip route
  kubectl exec test -- ping <other-pod-ip>
  ```

  CNI 설정 예시 (Calico):

  ```json
  {
    "name": "k8s-pod-network",
    "cniVersion": "0.3.1",
    "plugins": [
      {
        "type": "calico",
        "log_level": "info",
        "datastore_type": "kubernetes",
        "nodename": "__KUBERNETES_NODE_NAME__",
        "mtu": 1440,
        "ipam": {
          "type": "calico-ipam"
        },
        "policy": {
          "type": "k8s"
        }
      }
    ]
  }
  ```

  복구 절차:

  1. **즉시 조치**:
     - CNI 플러그인 재설치
     - kubelet 재시작

  2. **근본 원인 파악**:
     - Pod 이벤트 확인
     - CNI 로그 분석
     - 파일 권한 확인

  3. **영구 수정**:
     - CNI 설정 백업
     - 모니터링 설정
     - 문서화

  실무 팁:
  - CNI는 클러스터 핵심 컴포넌트
  - CNI 장애는 모든 신규 Pod 영향
  - 기존 Pod는 영향 없음 (이미 네트워크 설정됨)
  - CNI 변경 시 신중히 (모든 Pod 재생성 필요)
  - CNI 로그가 가장 중요한 정보원

references:
- https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storage-net/network-plugins/
- https://www.cni.dev/docs/

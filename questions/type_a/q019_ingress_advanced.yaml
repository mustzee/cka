id: A019
title: Ingress 경로 기반 라우팅 구성
domain: Services & Networking
difficulty: medium
weight: 6
time_estimate: 12
description: 'Context: kubectl config use-context cluster1


  회사의 웹 애플리케이션을 단일 도메인에서 경로 기반으로 라우팅해야 합니다.

  Ingress 리소스를 생성하여 다음 요구사항을 만족해야 합니다.

  '
task: "다음 요구사항을 만족하는 Ingress를 생성하세요:\n\n1. Ingress 정보:\n   - 이름: app-ingress\n   -\
  \ 네임스페이스: production\n   - IngressClass: nginx (annotation 사용)\n\n2. 라우팅 규칙:\n \
  \  - 호스트: app.example.com\n   - /api -> api-service:8080\n   - /web -> web-service:80\n\
  \   - / -> default-service:80\n\n3. TLS 설정:\n   - Secret: app-tls-secret (이미 존재함)\n\
  \   - Hosts: app.example.com\n\n4. 추가 요구사항:\n   - path type: Prefix\n   - 모든 서비스는\
  \ production 네임스페이스에 존재\n"
hints:
- kubectl create ingress --help로 기본 구조 확인
- rules, paths, backend 구조 이해 필요
- 여러 path를 하나의 host 아래 정의
- tls 섹션은 별도로 정의
validation:
  checks:
  - resource: ingress
    name: app-ingress
    namespace: production
solution: "Ingress 생성:\n\n```bash\n# 방법 1: YAML 파일로 생성\ncat <<EOF | kubectl apply\
  \ -f -\napiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: app-ingress\n\
  \  namespace: production\n  annotations:\n    kubernetes.io/ingress.class: nginx\n\
  \    nginx.ingress.kubernetes.io/rewrite-target: /\nspec:\n  tls:\n  - hosts:\n\
  \    - app.example.com\n    secretName: app-tls-secret\n  rules:\n  - host: app.example.com\n\
  \    http:\n      paths:\n      - path: /api\n        pathType: Prefix\n       \
  \ backend:\n          service:\n            name: api-service\n            port:\n\
  \              number: 8080\n      - path: /web\n        pathType: Prefix\n    \
  \    backend:\n          service:\n            name: web-service\n            port:\n\
  \              number: 80\n      - path: /\n        pathType: Prefix\n        backend:\n\
  \          service:\n            name: default-service\n            port:\n    \
  \          number: 80\nEOF\n\n# 방법 2: kubectl create 명령어 (부분적)\nkubectl create ingress\
  \ app-ingress \\\n  --rule=\"app.example.com/api*=api-service:8080\" \\\n  --rule=\"\
  app.example.com/web*=web-service:80\" \\\n  --rule=\"app.example.com/*=default-service:80\"\
  \ \\\n  --class=nginx \\\n  -n production --dry-run=client -o yaml > ingress.yaml\n\
  \n# TLS 설정 추가 (YAML 편집 필요)\nkubectl edit -f ingress.yaml\n\n# 확인\nkubectl get ingress\
  \ -n production\nkubectl describe ingress app-ingress -n production\n\n# Ingress\
  \ Controller Pod 확인\nkubectl get pods -n ingress-nginx\n\n# 테스트 (클러스터 내부에서)\nkubectl\
  \ run test --rm -i --tty --image=curlimages/curl -n production -- \\\n  curl -H\
  \ \"Host: app.example.com\" http://<ingress-ip>/api\n\nkubectl run test --rm -i\
  \ --tty --image=curlimages/curl -n production -- \\\n  curl -H \"Host: app.example.com\"\
  \ http://<ingress-ip>/web\n\n# Ingress IP 확인\nkubectl get ingress app-ingress -n\
  \ production -o jsonpath='{.status.loadBalancer.ingress[0].ip}'\n```\n\nPath Type\
  \ 설명:\n```yaml\n# Exact: 정확히 일치\npathType: Exact\npath: /api\n# /api만 매칭, /api/users는\
  \ 매칭 안 됨\n\n# Prefix: 경로 접두사 매칭 (가장 많이 사용)\npathType: Prefix\npath: /api\n# /api,\
  \ /api/, /api/users 모두 매칭\n\n# ImplementationSpecific: Ingress Controller 구현에 따름\n\
  pathType: ImplementationSpecific\n```\n"
explanation: "Ingress 경로 기반 라우팅을 평가합니다.\n\n주요 개념:\n1. Ingress 구조:\n   - rules: 라우팅\
  \ 규칙 정의\n   - host: 도메인 이름\n   - paths: 경로별 backend 지정\n   - tls: HTTPS 설정\n\n2.\
  \ Path Type:\n   - Exact: 정확한 경로만 매칭\n   - Prefix: 접두사 매칭 (권장)\n   - ImplementationSpecific:\
  \ Controller 의존\n\n3. Backend:\n   - service.name: 서비스 이름\n   - service.port.number:\
  \ 포트 번호\n   - 또는 service.port.name: 포트 이름\n\n4. TLS 설정:\n   - hosts: TLS 적용할 호스트\n\
  \   - secretName: 인증서 Secret\n   - Secret은 tls type이어야 함\n\nIngress Controller:\n\
  - NGINX Ingress Controller (가장 많이 사용)\n- Traefik\n- HAProxy\n- Kong\n- 클러스터에 설치되어\
  \ 있어야 함\n\n실무 패턴:\n```yaml\n# 여러 서비스를 하나의 도메인으로\napp.example.com/api -> API 서비스\n\
  app.example.com/web -> 웹 서비스\napp.example.com/admin -> 관리 서비스\n\n# 여러 도메인 라우팅\n\
  api.example.com -> API 서비스\nwww.example.com -> 웹 서비스\nadmin.example.com -> 관리 서비스\n\
  ```\n\n주요 Annotations:\n- nginx.ingress.kubernetes.io/rewrite-target: URL 재작성\n\
  - nginx.ingress.kubernetes.io/ssl-redirect: HTTPS 리다이렉트\n- nginx.ingress.kubernetes.io/rate-limit:\
  \ 속도 제한\n- nginx.ingress.kubernetes.io/cors-allow-origin: CORS 설정\n"
references:
- https://kubernetes.io/docs/concepts/services-networking/ingress/
- https://kubernetes.io/docs/concepts/services-networking/ingress-controllers/
- https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/
context: cluster1

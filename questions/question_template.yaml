# CKA 시험 문제 템플릿
# 이 템플릿을 사용하여 새로운 문제를 작성하세요

id: "Q001"
title: "문제 제목"
domain: "Cluster Architecture"  # 또는 Workloads, Services, Storage, Troubleshooting
difficulty: "medium"  # easy, medium, hard
weight: 5  # 점수 비중 (보통 1-10)
time_estimate: 5  # 예상 소요 시간 (분)

description: |
  문제 설명을 여기에 작성합니다.
  여러 줄로 작성 가능합니다.

  컨텍스트: kubectl config use-context cluster1

task: |
  수행해야 할 작업:
  1. 첫 번째 작업
  2. 두 번째 작업
  3. 세 번째 작업

hints:
  - "힌트 1"
  - "힌트 2"

# 자동 채점을 위한 검증 규칙
validation:
  type: "resource_exists"  # resource_exists, command_output, yaml_check, custom

  # 리소스 존재 확인
  checks:
    - resource: "pod"
      name: "nginx"
      namespace: "default"
      conditions:
        - type: "Ready"
          status: "True"

    - resource: "deployment"
      name: "web-app"
      namespace: "production"
      replicas: 3

  # 명령어 출력 검증 (선택사항)
  command_checks:
    - command: "kubectl get nodes -o json"
      jq_filter: ".items | length"
      expected: "3"

# 정답 및 해설
solution: |
  해결 방법:

  ```bash
  # 1단계: 네임스페이스 생성
  kubectl create namespace production

  # 2단계: 디플로이먼트 생성
  kubectl create deployment web-app --image=nginx --replicas=3 -n production

  # 3단계: 확인
  kubectl get deployment -n production
  ```

explanation: |
  이 문제는 다음을 평가합니다:
  - Kubernetes 리소스 생성 능력
  - 네임스페이스 관리
  - kubectl 명령어 숙련도

  핵심 개념:
  - Deployment는 Pod의 복제본을 관리합니다
  - 네임스페이스는 리소스를 논리적으로 분리합니다

references:
  - "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"
  - "https://kubernetes.io/docs/tasks/administer-cluster/namespaces/"

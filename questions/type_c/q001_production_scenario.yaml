id: "C001"
title: "프로덕션 애플리케이션 배포 및 모니터링"
domain: "Workloads & Scheduling"
difficulty: "hard"
weight: 10
time_estimate: 20

description: |
  Context: kubectl config use-context cluster1

  전자상거래 플랫폼의 새로운 마이크로서비스를 프로덕션 환경에 배포해야 합니다.
  서비스는 고가용성, 자동 복구, 리소스 제한을 포함해야 합니다.

task: |
  다음 요구사항을 만족하는 완전한 배포를 구성하세요:

  1. Namespace 생성: ecommerce

  2. Deployment 구성:
     - 이름: payment-service
     - 레플리카: 3
     - 이미지: nginx:1.24 (실제로는 결제 서비스)
     - 레이블: app=payment, tier=backend, env=production
     - 리소스 제한:
       * CPU 요청: 100m, 제한: 200m
       * 메모리 요청: 128Mi, 제한: 256Mi
     - Liveness Probe: HTTP GET / 포트 80, 초기 지연 10초, 주기 5초
     - Readiness Probe: HTTP GET / 포트 80, 초기 지연 5초, 주기 3초
     - Pod Anti-Affinity: 같은 노드에 2개 이상의 payment-service Pod 배치 방지

  3. HorizontalPodAutoscaler:
     - 대상: payment-service
     - 최소 레플리카: 3
     - 최대 레플리카: 10
     - CPU 사용률 목표: 70%

  4. Service 생성:
     - 이름: payment-svc
     - 타입: ClusterIP
     - 포트: 80

  5. ServiceAccount 및 RBAC:
     - ServiceAccount: payment-sa
     - Role: ConfigMap과 Secret에 대한 읽기 권한
     - RoleBinding: payment-sa를 Role에 바인딩
     - Deployment에서 payment-sa 사용

hints:
  - "프로덕션 워크로드는 항상 리소스 제한을 설정해야 합니다"
  - "HPA는 metrics-server가 필요합니다"
  - "Anti-affinity로 고가용성 보장"

validation:
  checks:
    - resource: "namespace"
      name: "ecommerce"

    - resource: "deployment"
      name: "payment-service"
      namespace: "ecommerce"
      conditions:
        - field: "spec.replicas"
          value: 3

    - resource: "hpa"
      name: "payment-service"
      namespace: "ecommerce"

    - resource: "service"
      name: "payment-svc"
      namespace: "ecommerce"

solution: |
  해결 방법:

  ```bash
  # 1. Namespace 생성
  kubectl create namespace ecommerce

  # 2. ServiceAccount 및 RBAC 구성
  cat <<EOF | kubectl apply -f -
  apiVersion: v1
  kind: ServiceAccount
  metadata:
    name: payment-sa
    namespace: ecommerce
  ---
  apiVersion: rbac.authorization.k8s.io/v1
  kind: Role
  metadata:
    name: config-reader
    namespace: ecommerce
  rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  ---
  apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata:
    name: payment-sa-binding
    namespace: ecommerce
  subjects:
  - kind: ServiceAccount
    name: payment-sa
  roleRef:
    kind: Role
    name: config-reader
    apiGroup: rbac.authorization.k8s.io
  EOF

  # 3. Deployment 생성
  cat <<EOF | kubectl apply -f -
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: payment-service
    namespace: ecommerce
    labels:
      app: payment
  spec:
    replicas: 3
    selector:
      matchLabels:
        app: payment
    template:
      metadata:
        labels:
          app: payment
          tier: backend
          env: production
      spec:
        serviceAccountName: payment-sa
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                  - key: app
                    operator: In
                    values:
                    - payment
                topologyKey: kubernetes.io/hostname
        containers:
        - name: payment
          image: nginx:1.24
          ports:
          - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 3
  EOF

  # 4. Service 생성
  kubectl expose deployment payment-service \
    --name=payment-svc \
    --port=80 \
    --type=ClusterIP \
    -n ecommerce

  # 5. HPA 생성
  kubectl autoscale deployment payment-service \
    --cpu-percent=70 \
    --min=3 \
    --max=10 \
    -n ecommerce

  # 확인
  kubectl get all -n ecommerce
  kubectl get hpa -n ecommerce
  kubectl describe deployment payment-service -n ecommerce

  # Pod 분산 확인
  kubectl get pods -n ecommerce -o wide

  # 리소스 사용량 확인
  kubectl top pods -n ecommerce
  ```

explanation: |
  이 문제는 프로덕션급 애플리케이션 배포 능력을 종합적으로 평가합니다.

  프로덕션 베스트 프랙티스:

  1. 리소스 관리:
     - 요청(Request): 스케줄링 보장
     - 제한(Limit): 리소스 과다 사용 방지
     - CPU는 압축 가능, 메모리는 비압축 가능

  2. 헬스 체크:
     - Liveness: 컨테이너 재시작 여부
     - Readiness: 트래픽 수신 준비 여부
     - Startup: 느린 시작 애플리케이션용

  3. 고가용성:
     - 최소 3개 레플리카
     - Pod Anti-Affinity로 노드 분산
     - 다중 가용 영역 배포

  4. 자동 스케일링:
     - HPA로 부하에 따른 자동 확장
     - VPA로 리소스 자동 조정
     - Cluster Autoscaler로 노드 확장

  5. 보안:
     - 전용 ServiceAccount
     - 최소 권한 원칙
     - Network Policy로 격리

  6. 관찰성:
     - 적절한 레이블링
     - 로깅 및 모니터링
     - 분산 추적

  실제 시나리오 고려사항:
  - Rolling Update 전략
  - Blue-Green 또는 Canary 배포
  - Circuit Breaker 패턴
  - Rate Limiting
  - 백업 및 재해 복구

references:
  - "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"
  - "https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/"
  - "https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity"

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cka-simulator
nodes:
  # Control plane node
  - role: control-plane
    image: kindest/node:v1.28.0
    extraPortMappings:
    - containerPort: 30000
      hostPort: 30000
      protocol: TCP
    kubeadmConfigPatches:
    - |
      kind: InitConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          node-labels: "node-role.kubernetes.io/control-plane="

  # Worker node 1
  - role: worker
    image: kindest/node:v1.28.0
    labels:
      node-type: worker
      disk: ssd
    kubeadmConfigPatches:
    - |
      kind: JoinConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          node-labels: "node-type=worker,disk=ssd"

  # Worker node 2
  - role: worker
    image: kindest/node:v1.28.0
    labels:
      node-type: worker
      disk: hdd
    kubeadmConfigPatches:
    - |
      kind: JoinConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          node-labels: "node-type=worker,disk=hdd"

networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
  disableDefaultCNI: false
